---
# include_tasks target (not import_tasks — this gets looped for customer-scope
# actions). Required params:
#   _state_instance_slug, _state_instance_name, _state_pg_name, _state_state
#     (_state_state: running | suspended | stopped)
#
# Scales Odoo+PG via k8s_scale, then re-points the instance's IngressRoute.
# The Host(...) match and whether a longpolling route exists are recovered
# from the LIVE IngressRoute rather than needing the original `domain`/`plan`
# again (customer-scope loops only know the instance's slug+name, discovered
# from labels — see discover-customer-instances.yml) — so this one file works
# identically whether called for a single instance or looped over a whole
# customer.
- name: "[{{ _state_instance_slug }}] Scale the Odoo Deployment"
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ customer_slug }}"
    name: "{{ _state_instance_name }}"
    replicas: "{{ 1 if _state_state == 'running' else 0 }}"
    wait: false

- name: "[{{ _state_instance_slug }}] Scale the Postgres StatefulSet"
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: StatefulSet
    namespace: "{{ customer_slug }}"
    name: "{{ _state_pg_name }}"
    replicas: "{{ 1 if _state_state == 'running' else 0 }}"
    wait: false

- name: "[{{ _state_instance_slug }}] Fetch the current IngressRoute"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: IngressRoute
    api_version: traefik.io/v1alpha1
    namespace: "{{ customer_slug }}"
    name: "{{ _state_instance_name }}"
  register: _state_ingressroute

- name: "[{{ _state_instance_slug }}] Assert the IngressRoute exists"
  ansible.builtin.assert:
    that: _state_ingressroute.resources | length > 0
    fail_msg: "No IngressRoute {{ _state_instance_name }} in {{ customer_slug }} - has this instance been deployed?"

- name: "[{{ _state_instance_slug }}] Recover the Host(...) match + longpolling flag"
  ansible.builtin.set_fact:
    _state_domain_match: >-
      {{ _state_ingressroute.resources[0].spec.routes
         | selectattr('match', 'search', '^Host')
         | map(attribute='match') | first }}
    _state_has_longpolling: >-
      {{ (_state_ingressroute.resources[0].spec.routes
          | selectattr('match', 'search', 'longpolling') | list | length) > 0 }}

- name: "[{{ _state_instance_slug }}] Re-apply the IngressRoute ({{ _state_state }})"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ customer_slug }}"
    template: ingressroute.yaml.j2
  vars:
    instance_name: "{{ _state_instance_name }}"
    instance_slug: "{{ _state_instance_slug }}"
    instance_state: "{{ _state_state }}"
    domain: "{{ _state_domain_match | regex_replace('^Host\\(`(.*)`\\)$', '\\1') }}"
    plan:
      workers: "{{ 1 if (_state_has_longpolling | bool) else 0 }}"
    odoo_labels_odoo: "{{ odoo_labels | combine({'app.kubernetes.io/name': 'odoo', 'xayma.sh/instance': _state_instance_slug}) }}"
