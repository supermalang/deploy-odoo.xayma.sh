---
# Final adhoc backup -> DROP DATABASE -> remove the tenant's PgBouncer entry
# -> purge the tenant's filestore prefix from MinIO -> delete every labelled
# tenant object -> if that was the pool's last tenant, scale the pool to 0
# (its objects are NEVER deleted - see README).
- name: Recover this tenant's current pool/state from live cluster facts
  ansible.builtin.import_tasks: _recover-tenant.yml
- name: Resolve the shared Postgres connection facts
  ansible.builtin.import_tasks: _pg-connection.yml

- name: "Set the final safety backup kind [{{ tenant_name }}]"
  ansible.builtin.set_fact:
    _backup_kind: adhoc

- name: Run the tenant backup Job
  ansible.builtin.import_tasks: _run-tenant-backup.yml

- name: "Fence the tenant database before dropping it [{{ tenant_name }}]"
  community.postgresql.postgresql_privs:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    database: postgres
    type: database
    objs: "{{ instance_slug }}"
    privs: CONNECT
    roles: PUBLIC
    state: absent

- name: "Terminate any live backends on this tenant's database [{{ tenant_name }}]"
  community.postgresql.postgresql_query:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    db: postgres
    query: "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = %(dbname)s"
    named_args:
      dbname: "{{ instance_slug }}"

- name: "DROP the tenant database [{{ tenant_name }}]"
  community.postgresql.postgresql_db:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    name: "{{ instance_slug }}"
    state: absent

- name: "Apply the filestore purge Job [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: job-purge-filestore.yaml.j2
  register: _delete_purge_job

# This used to apply the Job and move straight on to "Delete all labelled
# resources" below WITHOUT waiting for it - that step matches
# `kind: Job` on this tenant's own customer/instance labels, which this
# purge Job carries too, so it would delete (and cascade-terminate) the
# purge Job's pod out from under it while it was very likely still
# running, with nothing anywhere checking whether it had even started to
# succeed. job-purge-filestore.yaml.j2 now fails loudly on a real error
# instead of `|| true`-ing past it (see its own header comment) - that
# fix is meaningless if nothing ever waits long enough to see the result.
- name: "Wait for the filestore purge Job to complete [{{ tenant_name }}]"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Job
    namespace: "{{ xayma_namespace }}"
    name: "{{ _delete_purge_job.result.metadata.name }}"
  register: _delete_purge_status
  until: >-
    _delete_purge_status.resources | length > 0 and
    (_delete_purge_status.resources[0].status.succeeded | default(0) | int > 0 or
     _delete_purge_status.resources[0].status.failed | default(0) | int > 0)
  retries: 30
  delay: 5

- name: "Surface the filestore purge Job's pod logs on failure [{{ tenant_name }}]"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "job-name={{ _delete_purge_job.result.metadata.name }}"
  register: _delete_purge_logs
  when: _delete_purge_status.resources[0].status.failed | default(0) | int > 0

- name: "Assert the filestore purge Job succeeded [{{ tenant_name }}]"
  ansible.builtin.assert:
    that: _delete_purge_status.resources[0].status.succeeded | default(0) | int > 0
    fail_msg: >-
      {{ _delete_purge_job.result.metadata.name }} failed - pod logs:
      {{ _delete_purge_logs.log | default('(no logs captured)') }}
      The tenant database has already been dropped; the filestore prefix
      may still exist (see README "Backups & Restore") - re-run
      odoo_action=delete to retry the purge alone.

# propagationPolicy explicit (same reasoning as _assert-addons-repo.yml/
# _assert-init-modules.yml/deploy-tenant.yml's init pre-delete) - left
# unspecified, a raw API delete defaults to Orphan, not Background, so the
# Job entry in this loop (init-<tenant>/fixup-<tenant>-*/check-modules-
# <tenant>-* - this tenant's WHOLE Job history, matched by label) would
# delete every Job object while orphaning each one's Pod. For a tenant
# being deleted, that leaves dead Pods for a tenant that no longer exists
# anywhere else in the system - worse than the check-*/preflight case,
# since there's no live IngressRoute/Certificate left to even associate
# them back to. A no-op for the other four kinds in this loop (IngressRoute/
# Middleware/Certificate/Secret own no dependents to cascade to), applied
# uniformly since `delete_options` is shared across every item.
#
# `wait: true` added too - the comment below ("Regenerated AFTER the
# IngressRoute above is gone") already assumed this delete was synchronous,
# but nothing before this enforced that: without `wait`, this task returns
# as soon as the delete is ACCEPTED, not once the objects are actually
# gone, and the next two steps both read live IngressRoutes back (by label)
# to decide the pgbouncer regen + whether to scale the pool to 0 - a race
# against a still-in-flight deletion could see this tenant's IngressRoute
# as still present.
- name: "Delete all labelled resources for this tenant [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    namespace: "{{ xayma_namespace }}"
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    label_selectors:
      - "xayma.sh/customer={{ customer_slug }}"
      - "xayma.sh/instance={{ instance_slug }}"
    delete_options:
      propagationPolicy: Background
    wait: true
  loop:
    - {api_version: batch/v1, kind: Job}
    - {api_version: traefik.io/v1alpha1, kind: IngressRoute}
    - {api_version: traefik.io/v1alpha1, kind: Middleware}
    - {api_version: cert-manager.io/v1, kind: Certificate}
    - {api_version: v1, kind: Secret}
  loop_control:
    label: "{{ item.kind }}"

# Regenerated AFTER the IngressRoute above is gone, so this tenant naturally
# drops out of the tenants.ini - no override needed.
- name: "Remove this tenant's PgBouncer per-db entry [{{ tenant_name }}]"
  ansible.builtin.include_tasks: _sync-pgbouncer-tenants.yml

- name: "Count remaining tenants on the pool [{{ tenant_name ~ ' on ' ~ tenant_pool_id }}]"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: IngressRoute
    api_version: traefik.io/v1alpha1
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "xayma.sh/pool-id={{ tenant_pool_id }}"
  register: _delete_remaining_pool_tenants

- name: "Scale the pool to 0 - no tenants remain [{{ tenant_name ~ ' on ' ~ tenant_pool_id }}]"
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ xayma_namespace }}"
    name: "{{ item }}"
    replicas: 0
    wait: false
  loop:
    - "{{ tenant_pool_id }}-http"
    - "{{ tenant_pool_id }}-cron"
    - "{{ tenant_pool_id }}-gevent"
  loop_control:
    label: "{{ item }}"
  when: _delete_remaining_pool_tenants.resources | length == 0
