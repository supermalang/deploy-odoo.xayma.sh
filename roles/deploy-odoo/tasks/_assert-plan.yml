---
# Required for odoo_action=deploy/restart/snapshot only (see main.yml). This
# role is a stateless executor: it ships NO `plans:` dict and does not look
# anything up — the Xayma app resolves the plan and passes it as flat
# plan_* extra_vars (see defaults/main/01-deploy-odoo-defaults.yml for the
# full list and its defaults). No shape assertion is needed here: every
# plan_* var already has a role default, and AWX/the app enforce its type.
- name: Assert this role's own vault secrets are set
  ansible.builtin.assert:
    that:
      - vault_odoo_db_password | default('') | length > 0
      - vault_odoo_admin_password | default('') | length > 0
      - vault_odoo_minio_access_key | default('') | length > 0
      - vault_odoo_minio_secret_key | default('') | length > 0
    fail_msg: >-
      One or more vault_odoo_* secrets are unset. Copy
      defaults/main/02-credentials.yml.example, fill it in, and encrypt it
      with ansible-vault as defaults/main/02-credentials.yml.
