---
# tasks file for deploy-odoo (k3s)
#
# Dispatch is driven by a single `odoo_action` extra-var (AWX surveys set
# extra_vars, not --tags — see README.md "Actions"). Named `odoo_action`
# rather than `action` because `action` is an Ansible reserved variable name.
#
# This role is strictly instance-scoped: every action operates on exactly one
# instance. Customer-level operations (e.g. suspend every instance for a
# customer) are orchestrated by the Xayma app, which loops this Job Template
# over the customer's active instances.
#
# Instance scope: deploy, start, stop, suspend, restart, edit-domain, delete,
#                 restore
#
# Backups are orchestrated externally by n8n (driven by the app's live
# plan/payment status), not baked into the instance at deploy time — this
# role owns no snapshot policy or schedule. `restore` stays here: it's a
# deliberate ops action against a snapshot already sitting in the platform
# MinIO, not dynamic backup policy.

- import_tasks: _assert-identity.yml

- name: Assert a valid `odoo_action` was provided
  ansible.builtin.assert:
    that: odoo_action is defined and odoo_action in [
            'deploy','start','stop','suspend','restart','edit-domain','delete',
            'restore']
    fail_msg: "Set -e odoo_action=<one of: deploy|start|stop|suspend|restart|edit-domain|delete|restore>"

- import_tasks: _assert-plan.yml
  when: odoo_action in ['deploy', 'restart']

- import_tasks: deploy-instance.yml
  when: odoo_action == 'deploy'

- import_tasks: start-instance.yml
  when: odoo_action == 'start'

- import_tasks: stop-instance.yml
  when: odoo_action == 'stop'

- import_tasks: suspend-instance.yml
  when: odoo_action == 'suspend'

- import_tasks: restart-instance.yml
  when: odoo_action == 'restart'

- import_tasks: edit-instance-domainname.yml
  when: odoo_action == 'edit-domain'

- import_tasks: delete-instance.yml
  when: odoo_action == 'delete'

- import_tasks: restore-instance.yml
  when: odoo_action == 'restore'
