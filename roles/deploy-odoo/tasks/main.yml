---
# tasks file for deploy-odoo (k3s) - SHARED MULTI-TENANT POOL MODEL.
#
# Dispatch is driven by a single `odoo_action` extra-var (AWX surveys set
# extra_vars, not --tags - see README.md "Actions"). Named `odoo_action`
# rather than `action` because `action` is an Ansible reserved variable name.
#
# Two actions are NOT tenant-scoped - they carry no customer/instancename:
#   apply-plan   - pool-scoped (reconciles an existing pool's frozen sizing -
#                  see README "Plan resolution"); skips the tenant identity
#                  assert but still needs `version`+`plan` and the vault/
#                  plan asserts below.
#   check-snapshot-freshness - namespace-scoped (see
#                  tasks/check-snapshot-freshness.yml); skips the tenant
#                  identity assert (it reads its own tenant list from live
#                  IngressRoutes) but still needs the vault asserts below
#                  (it's the one non-tenant-scoped action that touches
#                  MinIO).
# Every other action is strictly tenant-scoped: it operates on exactly one
# tenant, never more. Customer-level operations (e.g. suspending every
# tenant for a customer that hasn't paid) are orchestrated by the Xayma app,
# which loops this same tenant-scoped Job Template over every active tenant
# belonging to that customer - the role itself carries no multi-tenant
# action and never will.

- name: Assert a valid `odoo_action` was provided
  ansible.builtin.assert:
    that: odoo_action is defined and odoo_action in [
            'deploy', 'start', 'stop', 'suspend', 'restart', 'edit-domain',
            'change-plan', 'apply-plan', 'delete',
            'restore', 'backup', 'check-snapshot-freshness']
    fail_msg: >-
      Set -e odoo_action=<one of: deploy|start|stop|suspend|restart|
      edit-domain|change-plan|apply-plan|delete|restore|
      backup|check-snapshot-freshness>

- name: Run odoo_action=check-snapshot-freshness
  ansible.builtin.import_tasks: check-snapshot-freshness.yml
  when: odoo_action == 'check-snapshot-freshness'

- name: Assert tenant identity vars are set
  ansible.builtin.import_tasks: _assert-identity.yml
  when: odoo_action not in ['apply-plan', 'check-snapshot-freshness']

- name: Assert this role's own vault secrets are set
  ansible.builtin.import_tasks: _assert-vault.yml

# Required for odoo_action=deploy/change-plan/apply-plan only - every other
# tenant-scoped action recovers its pool assignment from live state instead
# (see tasks/_recover-tenant.yml) rather than taking `plan` as input again.
- name: Assert the plan/pool topology is supported
  ansible.builtin.import_tasks: _assert-plan.yml
  when: odoo_action in ['deploy', 'change-plan', 'apply-plan']

- name: Run odoo_action=apply-plan
  ansible.builtin.import_tasks: apply-plan.yml
  when: odoo_action == 'apply-plan'

- name: Run odoo_action=deploy
  ansible.builtin.import_tasks: deploy-tenant.yml
  when: odoo_action == 'deploy'

- name: Run odoo_action=start
  ansible.builtin.import_tasks: start-tenant.yml
  when: odoo_action == 'start'

- name: Run odoo_action=stop
  ansible.builtin.import_tasks: stop-tenant.yml
  when: odoo_action == 'stop'

- name: Run odoo_action=suspend
  ansible.builtin.import_tasks: suspend-tenant.yml
  when: odoo_action == 'suspend'

- name: Run odoo_action=restart
  ansible.builtin.import_tasks: restart-tenant.yml
  when: odoo_action == 'restart'

- name: Run odoo_action=edit-domain
  ansible.builtin.import_tasks: edit-tenant-domain.yml
  when: odoo_action == 'edit-domain'

- name: Run odoo_action=change-plan
  ansible.builtin.import_tasks: change-plan.yml
  when: odoo_action == 'change-plan'

- name: Run odoo_action=delete
  ansible.builtin.import_tasks: delete-tenant.yml
  when: odoo_action == 'delete'

- name: Run odoo_action=restore
  ansible.builtin.import_tasks: restore-tenant.yml
  when: odoo_action == 'restore'

- name: Run odoo_action=backup
  ansible.builtin.import_tasks: backup-tenant.yml
  when: odoo_action == 'backup'
