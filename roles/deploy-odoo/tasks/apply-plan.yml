---
# Admin action - reconciles an EXISTING pool (version+plan) to the sent
# plan_spec regardless of its current frozen spec, bypassing the
# create-only guard in _resolve-pool.yml (see README "Plan resolution").
# This affects EVERY tenant currently served by this pool; there is no
# tenant identity in this action's input at all - just `version`+`plan`
# (+ optional plan_spec/plan_spec_json, same precedence as deploy/change-plan).
- import_tasks: _resolve-plan-spec.yml

- name: "[{{ pool_id }}] Log the forced pool reconcile"
  ansible.builtin.debug:
    msg: >-
      WARNING: odoo_action=apply-plan is reconciling pool {{ pool_id }} to a
      new pool-scoped spec (hash {{ pool_spec_hash }}). This resizes/rolls
      EVERY tenant currently served by this pool - see README "Plan
      resolution" for the blast radius.

- import_tasks: _resolve-pool.yml
  vars:
    _force_pool_apply: true
