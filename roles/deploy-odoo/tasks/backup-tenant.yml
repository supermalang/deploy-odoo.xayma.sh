---
# Single-tenant pg_dump + filestore tar -> MinIO. Designed to be driven by
# an AWX schedule the calling app loops per active tenant (see README "AWX"
# - AWX Schedules bind to one Job Template with fixed extra_vars, so
# multi-tenant iteration is app-driven, not something this role or
# configure-awx codifies per tenant).
- name: Recover this tenant's current pool/state from live cluster facts
  ansible.builtin.import_tasks: _recover-tenant.yml

- name: "Determine the snapshot kind [{{ tenant_name }}]"
  ansible.builtin.set_fact:
    _backup_kind: "{{ snapshot_kind | default('daily') }}"

- name: Run the tenant backup Job
  ansible.builtin.import_tasks: _run-tenant-backup.yml
