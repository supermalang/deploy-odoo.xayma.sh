---
# include_tasks helper - called from _resolve-pool.yml on every
# deploy/change-plan/apply-plan. Checks whether `{{ odoo_image_repo }}:{{
# odoo_image_tag }}` already exists in the registry; if not AND
# `odoo_image_build.enabled` is true, builds it from
# files/odoo-image/Dockerfile (layers the `redis`/`fsspec[s3]`/
# `python_slugify`/`packaging` Python packages onto the stock Odoo image -
# see README "Known caveats") and pushes it. If it's missing and building
# is disabled, fails fast - better than letting every pod in a brand-new
# pool crash-loop on a missing/wrong image.
#
# `odoo_image_tag` (set below, first thing) is `{{ version }}.0-<12 hex
# chars of the Dockerfile's own sha256>`, NOT bare `{{ version }}.0` - a
# fixed tag meant every rebuild of the SAME version (e.g. adding a Python
# package the addons need) silently kept the OLD tag, so this task's own
# "does the tag already exist" check kept saying yes, the build/push
# branch kept skipping, and every pod kept pulling the stale image under
# imagePullPolicy: IfNotPresent forever - confirmed live: an image missing
# `packaging` broke every tenant init, and fixing the Dockerfile alone
# changed nothing, because 19.0 still existed in the registry. Hashing the
# Dockerfile's content into the tag turns the existing skip-if-exists
# check into a content check instead of a version check: unchanged
# Dockerfile -> same tag -> still skipped, exactly as before; changed
# Dockerfile -> new tag -> actually built, pushed, and (per
# _resolve-pool.yml's pool_spec_hash, which never covers image/version at
# all - only sizing) rolled out to the live pool on the next normal
# deploy. Deliberately not `:latest`/imagePullPolicy: Always - those trade
# this exact silent-staleness bug for an equally silent one where a
# half-pushed or unrelated-node-cached image gets served instead.
# `odoo_image_tag` is consumed by every site that used to hand-build
# `{{ version }}.0` itself: this file's own build/push args,
# _assert-init-modules.yml's `_fileops_image`, job-init.yaml.j2,
# pool-deployments.yaml.j2's three Deployments, and (via
# deploy-tenant.yml's own `fixup_image` var - see that task and
# job-fixup.yaml.j2) the fixup Job THIS run's pool triggers. NOT consumed
# by restore-tenant.yml's fixup call: that one fixes up a possibly
# DIFFERENT, already-existing pool (tenant_version, recovered from live
# state - this pool was never resolved/built in the current run at all),
# so it reads that pool's ACTUAL running image straight off its
# Deployment instead of reconstructing a tag with no way to know what
# hash suffix that pool's image was last built with.
#
# Uses `nerdctl` against k3s's OWN EMBEDDED containerd
# (`k3s_containerd_socket`) - DELIBERATELY not a separate Docker daemon.
# k3s ships containerd already; nerdctl is a Docker-CLI-compatible tool
# that talks to it directly, so there is no second container runtime to
# install/maintain on the node. Requires the "nerdctl-full" release
# (https://github.com/containerd/nerdctl/releases) specifically, not the
# bare binary - plain nerdctl doesn't bundle buildkitd, which `nerdctl
# build` needs.
#
# `nerdctl` here runs on the MANAGED NODE (this whole play is `hosts: all`
# over SSH/become, never `connection: local`), because it needs that node's
# own k3s containerd socket. `role_path` is NOT that - it's always a
# CONTROL-NODE path (wherever ansible-playbook/AWX's execution environment
# itself runs, e.g. an AWX job's /runner/project checkout), even though it
# renders as an ordinary-looking string inside a task on a remote-executed
# play. Handing `{{ role_path }}/files/odoo-image` straight to a command
# that runs on the managed node points it at a path that simply doesn't
# exist there - confirmed live: it failed identically whether the build
# file was named Dockerfile or Containerfile, and whether -f was passed
# explicitly or left to nerdctl's default, because the entire directory
# was missing on that host, not just one filename inside it. Fixed by
# copying the build context to the managed node first (see the "Stage the
# odoo-image build context" task) and building from THAT path instead.
# The registry check itself is unrelated to any of that - it uses Docker
# Hub's REST API directly (not a local image cache, which can't tell you
# whether a tag was ever actually PUSHED). Works anonymously for public
# repos; supplies a JWT (via the same Hub API login endpoint) when
# vault_odoo_dockerhub_username is set, for private repos.

- name: "Compute this pool's content-derived Odoo image tag"
  ansible.builtin.set_fact:
    odoo_image_tag: >-
      {{ version }}.0-{{ (lookup('file', role_path + '/files/odoo-image/Dockerfile') | hash('sha256'))[:12] }}

- name: "Authenticate to the Docker Hub API (private-repo tag check) [{{ odoo_image_repo ~ ':' ~ odoo_image_tag }}]"
  ansible.builtin.uri:
    url: "https://hub.docker.com/v2/users/login/"
    method: POST
    body_format: json
    body:
      username: "{{ vault_odoo_dockerhub_username }}"
      password: "{{ vault_odoo_dockerhub_token }}"
    status_code: [200, 401]
  register: _dockerhub_login
  no_log: true
  when: vault_odoo_dockerhub_username | default('') | length > 0

- name: "Set the Docker Hub JWT fact [{{ odoo_image_repo ~ ':' ~ odoo_image_tag }}]"
  ansible.builtin.set_fact:
    _dockerhub_jwt: "{{ _dockerhub_login.json.token | default('') }}"
  no_log: true
  when: vault_odoo_dockerhub_username | default('') | length > 0

- name: "Check whether the tag already exists in the registry [{{ odoo_image_repo ~ ':' ~ odoo_image_tag }}]"
  ansible.builtin.uri:
    url: "https://hub.docker.com/v2/repositories/{{ odoo_image_repo }}/tags/{{ odoo_image_tag }}/"
    status_code: [200, 401, 404]
    headers: >-
      {{ {'Authorization': 'JWT ' ~ _dockerhub_jwt} if (_dockerhub_jwt | default('') | length > 0) else {} }}
  register: _odoo_image_check
  failed_when: false

- name: "Assert automatic build is enabled, or the tag already exists [{{ odoo_image_repo ~ ':' ~ odoo_image_tag }}]"
  ansible.builtin.assert:
    that: (_odoo_image_check.status | default(0)) == 200 or (odoo_image_build.enabled | bool)
    fail_msg: >-
      {{ odoo_image_repo }}:{{ odoo_image_tag }} does not exist in the registry
      (HTTP {{ _odoo_image_check.status | default('?') }}) and
      odoo_image_build.enabled is false - either push it manually (see
      README "Custom Odoo image") or set odoo_image_build.enabled: true
      (and vault_odoo_dockerhub_username/vault_odoo_dockerhub_token) once
      nerdctl-full is installed on this host.

- name: "Build + push the missing tag via nerdctl [{{ odoo_image_repo ~ ':' ~ odoo_image_tag }}]"
  when: (_odoo_image_check.status | default(0)) != 200
  block:
    - name: "Assert Docker Hub credentials are set before attempting a build"
      ansible.builtin.assert:
        that:
          - vault_odoo_dockerhub_username | default('') | length > 0
          - vault_odoo_dockerhub_token | default('') | length > 0
        fail_msg: >-
          odoo_image_build.enabled is true and
          {{ odoo_image_repo }}:{{ odoo_image_tag }} is missing from the
          registry, but vault_odoo_dockerhub_username/vault_odoo_dockerhub_token
          are unset - add them to defaults/main/02-credentials.yml (see
          .example) before retrying.

    - name: "Check whether nerdctl is installed on this host"
      ansible.builtin.command:
        argv: ["nerdctl", "--version"]
      register: _nerdctl_check
      failed_when: false
      changed_when: false

    # This only proves the `nerdctl` binary is on PATH, NOT that a build
    # can actually succeed - `nerdctl build` additionally needs BuildKit
    # itself running as its own separate process/service (confirmed
    # against nerdctl's own docs/build.md: nerdctl-full merely BUNDLES the
    # buildkitd binary; it does not start or enable it). That is a second,
    # easy-to-miss manual step - `sudo systemctl enable --now buildkit`
    # (rootful) or `containerd-rootless-setuptool.sh install-buildkit[-containerd]`
    # (rootless) - documented nowhere else in this role because this
    # branch had never actually executed against a real daemon before.
    # Not probed for here (no read-only nerdctl command reliably confirms
    # a live BuildKit connection without depending on exactly how it was
    # set up - socket path varies by rootful/rootless/custom
    # --buildkit-host); if it's missing, the "Build via nerdctl" task
    # below will fail with a BuildKit connection error instead of this
    # assert's - that failure's own message won't mention this step, so
    # this comment is the pointer to it.
    - name: "Assert nerdctl is available before attempting a build"
      ansible.builtin.assert:
        that: (_nerdctl_check.rc | default(1)) == 0
        fail_msg: >-
          nerdctl is not installed/on PATH on this host, but
          odoo_image_build.enabled is true and
          {{ odoo_image_repo }}:{{ odoo_image_tag }} is missing from the
          registry. Install nerdctl-full
          (https://github.com/containerd/nerdctl/releases - the full
          bundle, not the bare binary, so buildkitd is included) on the
          k3s node, THEN separately enable/start BuildKit itself
          (`sudo systemctl enable --now buildkit` for rootful - nerdctl-full
          only bundles the buildkitd binary, it does not start it) before
          retrying.

    - name: "Log in to the registry via nerdctl"
      ansible.builtin.command:
        argv:
          - nerdctl
          - login
          - --username
          - "{{ vault_odoo_dockerhub_username }}"
          - --password-stdin
        stdin: "{{ vault_odoo_dockerhub_token }}"
      no_log: true
      changed_when: false

    # nerdctl builds on the managed node, but files/odoo-image only exists
    # on the CONTROL NODE (role_path) - copy it over first rather than
    # handing nerdctl a control-node-only path (see this file's header
    # comment for how that was actually diagnosed). `copy` transfers
    # control-node -> managed-node; re-run every time so a Dockerfile edit
    # always lands before the next build, not just on the first one.
    - name: "Stage the odoo-image build context on the managed node"
      ansible.builtin.copy:
        src: "{{ role_path }}/files/odoo-image/"
        dest: /tmp/xayma-odoo-image-build/
        mode: "0644"

    - name: "Build via nerdctl (k3s's embedded containerd): {{ odoo_image_repo ~ ':' ~ odoo_image_tag }}"
      ansible.builtin.command:
        argv:
          - nerdctl
          - --address
          - "{{ k3s_containerd_socket }}"
          - --namespace
          - "{{ nerdctl_namespace }}"
          - build
          - -f
          - /tmp/xayma-odoo-image-build/Dockerfile
          - --build-arg
          - "ODOO_VERSION={{ version }}"
          - --pull
          - -t
          - "{{ odoo_image_repo }}:{{ odoo_image_tag }}"
          - /tmp/xayma-odoo-image-build
      changed_when: true

    - name: "Push the image tag: {{ odoo_image_repo ~ ':' ~ odoo_image_tag }}"
      ansible.builtin.command:
        argv:
          - nerdctl
          - --address
          - "{{ k3s_containerd_socket }}"
          - --namespace
          - "{{ nerdctl_namespace }}"
          - push
          - "{{ odoo_image_repo }}:{{ odoo_image_tag }}"
      changed_when: true
