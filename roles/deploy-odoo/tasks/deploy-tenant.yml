---
# Create/update a tenant: shared platform + pool bootstrap, then a one-shot
# DB birth (NO template databases - see README), then the tenant's routing.
# Idempotent `state: present` throughout; the init Job is guarded so it
# NEVER re-runs against an already-initialized database (see the
# "Determine whether the one-shot init Job must run" step below).

- name: Ensure the shared platform singletons exist
  ansible.builtin.import_tasks: _ensure-platform.yml
- name: Resolve the effective plan_spec
  ansible.builtin.import_tasks: _resolve-plan-spec.yml
- name: Resolve (or create) this tenant's pool
  ansible.builtin.import_tasks: _resolve-pool.yml

# Fail fast, before any DB/Job work, if a requested custom_domain doesn't
# actually point at this platform yet - otherwise cert-manager's ACME
# HTTP-01 challenge would just hang. default_domain is used as the known-
# good reference point (it always resolves correctly via the platform's
# wildcard DNS once ANY tenant is live).
- name: "Resolve the platform's edge IP (via the default host) [{{ tenant_name }}]"
  ansible.builtin.set_fact:
    _deploy_platform_ip: "{{ lookup('community.general.dig', default_domain) }}"
  when: custom_domain | default('') | length > 0

- name: "Resolve the requested custom domain [{{ tenant_name }}]"
  ansible.builtin.set_fact:
    _deploy_custom_domain_ip: "{{ lookup('community.general.dig', custom_domain) }}"
  when: custom_domain | default('') | length > 0

- name: "Assert the custom domain points at this platform [{{ tenant_name }}]"
  ansible.builtin.assert:
    that: _deploy_custom_domain_ip == _deploy_platform_ip
    fail_msg: >-
      custom_domain ({{ custom_domain }}) resolves to
      {{ _deploy_custom_domain_ip }}, not this platform's edge IP
      ({{ _deploy_platform_ip }}, resolved via {{ default_domain }}). Point
      its DNS record at the platform before retrying.
  when: custom_domain | default('') | length > 0

- name: "Check whether the tenant database exists [{{ tenant_name }}]"
  community.postgresql.postgresql_info:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    filter: databases
  register: _deploy_pg_info
  no_log: true

- name: "Check whether the tenant database is already initialized [{{ tenant_name }}]"
  community.postgresql.postgresql_query:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    db: "{{ instance_slug }}"
    query: "SELECT 1 FROM information_schema.tables WHERE table_name = 'ir_module_module'"
  register: _deploy_init_check
  when: instance_slug in (_deploy_pg_info.databases | default({}))
  failed_when: false
  no_log: true

# Idempotency guard (see README "Actions"): db exists AND contains
# ir_module_module -> skip init; exists but empty -> init allowed; missing
# -> create + init. An already-initialized db is NEVER re-init'd.
- name: "Determine whether the one-shot init Job must run [{{ tenant_name }}]"
  ansible.builtin.set_fact:
    _deploy_needs_init: >-
      {{ (instance_slug not in (_deploy_pg_info.databases | default({})))
         or ((_deploy_init_check.rowcount | default(0) | int) == 0) }}

- name: "Apply the tenant's ADMIN_PASSWD Secret [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-secret.yaml.j2
  no_log: true

- name: "Create the tenant database (if missing) [{{ tenant_name }}]"
  community.postgresql.postgresql_db:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    name: "{{ instance_slug }}"
    owner: "{{ pool_pg_role }}"
    state: present

# Admin/backup grants are issued here too so they exist from birth, not
# only from the first suspend/resume cycle.
- name: "REVOKE CONNECT from PUBLIC on the tenant database [{{ tenant_name }}]"
  community.postgresql.postgresql_privs:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    database: postgres
    type: database
    objs: "{{ instance_slug }}"
    privs: CONNECT
    roles: PUBLIC
    state: absent

- name: "GRANT CONNECT to the pool role + admin/backup roles [{{ tenant_name }}]"
  community.postgresql.postgresql_privs:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    database: postgres
    type: database
    objs: "{{ instance_slug }}"
    privs: CONNECT
    roles: "{{ item }}"
    state: present
  loop:
    - "{{ pool_pg_role }}"
    - "{{ pgadmin_ro_role }}"
    - "{{ backup_ro_role }}"
  loop_control:
    label: "{{ item }}"

# Materialize this tenant's PgBouncer per-database cap BEFORE the init Job -
# the init Job itself still talks to PG directly, never through PgBouncer,
# so this ordering is about establishing desired state deterministically,
# not a runtime dependency.
- name: "Write this tenant's PgBouncer per-db entry [{{ tenant_name }}]"
  ansible.builtin.include_tasks: _sync-pgbouncer-tenants.yml
  vars:
    _pgb_override_slug: "{{ instance_slug }}"
    _pgb_override_cap: "{{ tenant_spec.tenant_db_max_connections }}"

- name: Assert the tenant's init_modules exist in the addons repo
  ansible.builtin.import_tasks: _assert-init-modules.yml
  when: _deploy_needs_init | bool

- name: "Run the one-shot init Job [{{ tenant_name }}]"
  when: _deploy_needs_init | bool
  block:
    # init-{{ instance_slug }}'s Job spec.template is IMMUTABLE once
    # created - a Kubernetes invariant on Jobs, not something this role
    # controls. Any change to what this pod template renders to between
    # two deploy attempts (a new image tag, a different odoo.conf
    # ConfigMap name, an added volume, ...) makes a re-apply against an
    # EXISTING Job of this name fail outright with "field is invalid:
    # spec.template: ... field is immutable", wedging the tenant until
    # someone deletes the Job by hand. Live incident: fara-kho2 - a fixed
    # odoo.conf bug changed this pod template between two runs, and the
    # second run's apply failed on exactly this. Deleting any existing
    # Job of this name FIRST, unconditionally, before every apply - not
    # only after detecting a failure - closes this for good: the "Wait
    # for the init Job"/"Surface... pod logs on failure" steps below
    # already put a failed run's logs into the AWX output at the moment
    # it happened, so deleting it on the NEXT run discards nothing.
    # `wait: true` so its pod(s) are gone too, not just the Job object,
    # before the apply below creates a fresh one. Deleting a Job that
    # doesn't exist yet (the common case - first init for a tenant) is a
    # no-op, not an error.
    #
    # Kept the deterministic (non-timestamped) name deliberately, unlike
    # the preflight/closure-check Jobs (_assert-addons-repo.yml/
    # _assert-init-modules.yml), which timestamp themselves because THEY
    # delete themselves as part of their own success path and may run
    # more than once per deploy attempt - a fixed, guessable name here
    # means `kubectl logs job/init-<slug>` stays meaningful for as long
    # as the Job survives ttlSecondsAfterFinished, which matters more for
    # this one-per-tenant, run-once-per-lifetime Job than for those.
    - name: "Delete any existing init Job before applying (spec.template is immutable) [{{ tenant_name }}]"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: batch/v1
        kind: Job
        namespace: "{{ xayma_namespace }}"
        name: "init-{{ instance_slug }}"
        wait: true

    - name: "Apply the init Job [{{ tenant_name }}]"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        namespace: "{{ xayma_namespace }}"
        template: job-init.yaml.j2

    - name: "Wait for the init Job to complete [{{ tenant_name }}]"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Job
        namespace: "{{ xayma_namespace }}"
        name: "init-{{ instance_slug }}"
      register: _deploy_init_status
      until: >-
        _deploy_init_status.resources | length > 0 and
        (_deploy_init_status.resources[0].status.succeeded | default(0) | int > 0 or
         _deploy_init_status.resources[0].status.failed | default(0) | int > 0)
      retries: 90
      delay: 10

    - name: "Surface the init Job's pod logs on failure [{{ tenant_name }}]"
      kubernetes.core.k8s_log:
        kubeconfig: "{{ kubeconfig_path }}"
        namespace: "{{ xayma_namespace }}"
        label_selectors:
          - "job-name=init-{{ instance_slug }}"
      register: _deploy_init_logs
      when: _deploy_init_status.resources[0].status.failed | default(0) | int > 0

    - name: "Assert the init Job succeeded [{{ tenant_name }}]"
      ansible.builtin.assert:
        that: _deploy_init_status.resources[0].status.succeeded | default(0) | int > 0
        fail_msg: >-
          init-{{ instance_slug }} failed - pod logs:
          {{ _deploy_init_logs.log | default('(no logs captured)') }}

# Runs on EVERY deploy (not just first init) - idempotently resets the
# derived admin password and refreshes company/config defaults, which also
# doubles as a documented way to recover a forgotten admin password.
- name: "Apply the fixup Job [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: job-fixup.yaml.j2
  vars:
    # deploy legitimately owns version/pool_config_name/pool_secret_name
    # (real extra_vars/vars/main.yml-derived here) - see job-fixup.yaml.j2's
    # header comment for why it reads these under different names instead
    # of the plain ones directly. fixup_image reuses odoo_image_tag - the
    # SAME content-derived tag _resolve-pool.yml (via _ensure-odoo-image.yml,
    # already run earlier in this same task file) just ensured exists for
    # THIS pool - not a bare "{{ version }}.0" this template would have to
    # reconstruct itself.
    fixup_image: "{{ odoo_image_repo }}:{{ odoo_image_tag }}"
    fixup_pool_config_name: "{{ pool_config_name }}"
    fixup_pool_secret_name: "{{ pool_secret_name }}"
  register: _deploy_fixup_job

# job-fixup.yaml.j2's Job name carries a timestamp suffix
# (fixup-{{ instance_slug }}-{{ ansible_date_time... }}), so it is NEVER
# just "fixup-{{ instance_slug }}" - waiting/asserting on that guessed
# fixed name would never match, timing out after `retries` and then
# indexing resources[0] on an empty list. Use the apply task's own
# registered name instead, same pattern restore-tenant.yml's fixup call
# and every other timestamped Job (backup/restore/snapshot-freshness-check)
# already use.
- name: "Wait for the fixup Job to complete [{{ tenant_name }}]"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Job
    namespace: "{{ xayma_namespace }}"
    name: "{{ _deploy_fixup_job.result.metadata.name }}"
  register: _deploy_fixup_status
  until: >-
    _deploy_fixup_status.resources | length > 0 and
    (_deploy_fixup_status.resources[0].status.succeeded | default(0) | int > 0 or
     _deploy_fixup_status.resources[0].status.failed | default(0) | int > 0)
  retries: 30
  delay: 5

- name: "Surface the fixup Job's pod logs on failure [{{ tenant_name }}]"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "job-name={{ _deploy_fixup_job.result.metadata.name }}"
  register: _deploy_fixup_logs
  when: _deploy_fixup_status.resources[0].status.failed | default(0) | int > 0

- name: "Assert the fixup Job succeeded [{{ tenant_name }}]"
  ansible.builtin.assert:
    that: _deploy_fixup_status.resources[0].status.succeeded | default(0) | int > 0
    fail_msg: >-
      {{ _deploy_fixup_job.result.metadata.name }} failed - pod logs:
      {{ _deploy_fixup_logs.log | default('(no logs captured)') }}

- name: "Apply the tenant's custom-domain Certificate [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-certificate.yaml.j2
  when: custom_domain | default('') | length > 0

- name: "Remove any stale custom-domain Certificate + IngressRoute + hostrewrite Middleware [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ xayma_namespace }}"
    name: "{{ item.name }}"
  loop:
    - {api_version: cert-manager.io/v1, kind: Certificate, name: "{{ tenant_name }}-tls"}
    - {api_version: traefik.io/v1alpha1, kind: IngressRoute, name: "{{ tenant_name }}-custom"}
    - {api_version: traefik.io/v1alpha1, kind: Middleware, name: "{{ tenant_hostrewrite_mw_name }}"}
  loop_control:
    label: "{{ item.kind }}"
  when: custom_domain | default('') | length == 0

- name: "Apply the tenant's ratelimit Middleware + IngressRoute (running) [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-ingressroute.yaml.j2
  vars:
    instance_state: running
    # deploy legitimately owns pool_id/pool_http_name/pool_gevent_name/
    # version/plan (real extra_vars/vars/main.yml-derived here) - see
    # tenant-ingressroute.yaml.j2's header comment for why it reads these
    # under different names instead of the plain ones directly.
    ingress_pool_http_name: "{{ pool_http_name }}"
    ingress_pool_gevent_name: "{{ pool_gevent_name }}"
    tenant_assignment_pool_id: "{{ pool_id }}"
    tenant_assignment_version: "{{ version }}"
    tenant_assignment_plan: "{{ plan }}"

- name: "Smoke test the tenant's default host [{{ tenant_name }}]"
  ansible.builtin.uri:
    url: "https://{{ default_domain }}/web/login"
    status_code: 200
    validate_certs: true
  register: _deploy_smoke
  until: _deploy_smoke.status | default(0) == 200
  retries: 30
  delay: 10
