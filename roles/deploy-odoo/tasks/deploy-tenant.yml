---
# Create/update a tenant: shared platform + pool bootstrap, then a one-shot
# DB birth (NO template databases - see README), then the tenant's routing.
# Idempotent `state: present` throughout; the init Job is guarded so it
# NEVER re-runs against an already-initialized database (see the
# "Determine whether the one-shot init Job must run" step below).

- import_tasks: _ensure-platform.yml
- import_tasks: _resolve-plan-spec.yml
- import_tasks: _resolve-pool.yml

# Fail fast, before any DB/Job work, if a requested custom_domain doesn't
# actually point at this platform yet - otherwise cert-manager's ACME
# HTTP-01 challenge would just hang. default_domain is used as the known-
# good reference point (it always resolves correctly via the platform's
# wildcard DNS once ANY tenant is live).
- name: "[{{ tenant_name }}] Resolve the platform's edge IP (via the default host)"
  ansible.builtin.set_fact:
    _deploy_platform_ip: "{{ lookup('community.general.dig', default_domain) }}"
  when: custom_domain | default('') | length > 0

- name: "[{{ tenant_name }}] Resolve the requested custom domain"
  ansible.builtin.set_fact:
    _deploy_custom_domain_ip: "{{ lookup('community.general.dig', custom_domain) }}"
  when: custom_domain | default('') | length > 0

- name: "[{{ tenant_name }}] Assert the custom domain points at this platform"
  ansible.builtin.assert:
    that: _deploy_custom_domain_ip == _deploy_platform_ip
    fail_msg: >-
      custom_domain ({{ custom_domain }}) resolves to
      {{ _deploy_custom_domain_ip }}, not this platform's edge IP
      ({{ _deploy_platform_ip }}, resolved via {{ default_domain }}). Point
      its DNS record at the platform before retrying.
  when: custom_domain | default('') | length > 0

- name: "[{{ tenant_name }}] Check whether the tenant database exists"
  community.postgresql.postgresql_info:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    filter: databases
  register: _deploy_pg_info
  no_log: true

- name: "[{{ tenant_name }}] Check whether the tenant database is already initialized"
  community.postgresql.postgresql_query:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    db: "{{ instance_slug }}"
    query: "SELECT 1 FROM information_schema.tables WHERE table_name = 'ir_module_module'"
  register: _deploy_init_check
  when: instance_slug in (_deploy_pg_info.databases | default({}))
  failed_when: false
  no_log: true

# Idempotency guard (see README "Actions"): db exists AND contains
# ir_module_module -> skip init; exists but empty -> init allowed; missing
# -> create + init. An already-initialized db is NEVER re-init'd.
- name: "[{{ tenant_name }}] Determine whether the one-shot init Job must run"
  ansible.builtin.set_fact:
    _deploy_needs_init: >-
      {{ (instance_slug not in (_deploy_pg_info.databases | default({})))
         or ((_deploy_init_check.rowcount | default(0) | int) == 0) }}

- name: "[{{ tenant_name }}] Apply the tenant's ADMIN_PASSWD Secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-secret.yaml.j2
  no_log: true

- name: "[{{ tenant_name }}] Create the tenant database (if missing)"
  community.postgresql.postgresql_db:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    name: "{{ instance_slug }}"
    owner: "{{ pool_pg_role }}"
    state: present

# Admin/backup grants are issued here too so they exist from birth, not
# only from the first suspend/resume cycle.
- name: "[{{ tenant_name }}] REVOKE CONNECT from PUBLIC on the tenant database"
  community.postgresql.postgresql_privs:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    database: postgres
    type: database
    objs: "{{ instance_slug }}"
    privs: CONNECT
    roles: PUBLIC
    state: absent

- name: "[{{ tenant_name }}] GRANT CONNECT to the pool role + admin/backup roles"
  community.postgresql.postgresql_privs:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    database: postgres
    type: database
    objs: "{{ instance_slug }}"
    privs: CONNECT
    roles: "{{ item }}"
    state: present
  loop:
    - "{{ pool_pg_role }}"
    - "{{ pgadmin_ro_role }}"
    - "{{ backup_ro_role }}"
  loop_control:
    label: "{{ item }}"

# Materialize this tenant's PgBouncer per-database cap BEFORE the init Job -
# same sequencing as README "Tenant lifecycle" (the init Job itself still
# talks to PG directly, never through PgBouncer - this ordering is about
# establishing desired state deterministically, not a runtime dependency).
- name: "[{{ tenant_name }}] Write this tenant's PgBouncer per-db entry"
  ansible.builtin.include_tasks: _sync-pgbouncer-tenants.yml
  vars:
    _pgb_override_slug: "{{ instance_slug }}"
    _pgb_override_cap: "{{ tenant_spec.tenant_db_max_connections }}"

- import_tasks: _assert-init-modules.yml
  when: _deploy_needs_init | bool

- name: "[{{ tenant_name }}] Run the one-shot init Job"
  when: _deploy_needs_init | bool
  block:
    - name: "[{{ tenant_name }}] Apply the init Job"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        namespace: "{{ xayma_namespace }}"
        template: job-init.yaml.j2

    - name: "[{{ tenant_name }}] Wait for the init Job to complete"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Job
        namespace: "{{ xayma_namespace }}"
        name: "init-{{ instance_slug }}"
      register: _deploy_init_status
      until: >-
        _deploy_init_status.resources | length > 0 and
        (_deploy_init_status.resources[0].status.succeeded | default(0) | int > 0 or
         _deploy_init_status.resources[0].status.failed | default(0) | int > 0)
      retries: 90
      delay: 10

    - name: "[{{ tenant_name }}] Surface the init Job's pod logs on failure"
      kubernetes.core.k8s_log:
        kubeconfig: "{{ kubeconfig_path }}"
        namespace: "{{ xayma_namespace }}"
        label_selectors:
          - "job-name=init-{{ instance_slug }}"
      register: _deploy_init_logs
      when: _deploy_init_status.resources[0].status.failed | default(0) | int > 0

    - name: "[{{ tenant_name }}] Assert the init Job succeeded"
      ansible.builtin.assert:
        that: _deploy_init_status.resources[0].status.succeeded | default(0) | int > 0
        fail_msg: >-
          init-{{ instance_slug }} failed - pod logs:
          {{ _deploy_init_logs.log | default('(no logs captured)') }}

# Runs on EVERY deploy (not just first init) - idempotently resets the
# derived admin password and refreshes company/config defaults, which also
# doubles as a documented way to recover a forgotten admin password.
- name: "[{{ tenant_name }}] Apply the fixup Job"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: job-fixup.yaml.j2

- name: "[{{ tenant_name }}] Wait for the fixup Job to complete"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Job
    namespace: "{{ xayma_namespace }}"
    name: "fixup-{{ instance_slug }}"
  register: _deploy_fixup_status
  until: >-
    _deploy_fixup_status.resources | length > 0 and
    (_deploy_fixup_status.resources[0].status.succeeded | default(0) | int > 0 or
     _deploy_fixup_status.resources[0].status.failed | default(0) | int > 0)
  retries: 30
  delay: 5

- name: "[{{ tenant_name }}] Surface the fixup Job's pod logs on failure"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "job-name=fixup-{{ instance_slug }}"
  register: _deploy_fixup_logs
  when: _deploy_fixup_status.resources[0].status.failed | default(0) | int > 0

- name: "[{{ tenant_name }}] Assert the fixup Job succeeded"
  ansible.builtin.assert:
    that: _deploy_fixup_status.resources[0].status.succeeded | default(0) | int > 0
    fail_msg: >-
      fixup-{{ instance_slug }} failed - pod logs:
      {{ _deploy_fixup_logs.log | default('(no logs captured)') }}

- name: "[{{ tenant_name }}] Apply the tenant's custom-domain Certificate"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-certificate.yaml.j2
  when: custom_domain | default('') | length > 0

- name: "[{{ tenant_name }}] Remove any stale custom-domain Certificate + IngressRoute + hostrewrite Middleware"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ xayma_namespace }}"
    name: "{{ item.name }}"
  loop:
    - {api_version: cert-manager.io/v1, kind: Certificate, name: "{{ tenant_name }}-tls"}
    - {api_version: traefik.io/v1alpha1, kind: IngressRoute, name: "{{ tenant_name }}-custom"}
    - {api_version: traefik.io/v1alpha1, kind: Middleware, name: "{{ tenant_hostrewrite_mw_name }}"}
  loop_control:
    label: "{{ item.kind }}"
  when: custom_domain | default('') | length == 0

- name: "[{{ tenant_name }}] Apply the tenant's ratelimit Middleware + IngressRoute (running)"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-ingressroute.yaml.j2
  vars:
    instance_state: running

- name: "[{{ tenant_name }}] Smoke test the tenant's default host"
  ansible.builtin.uri:
    url: "https://{{ default_domain }}/web/login"
    status_code: 200
    validate_certs: true
  register: _deploy_smoke
  until: _deploy_smoke.status | default(0) == 200
  retries: 30
  delay: 10
