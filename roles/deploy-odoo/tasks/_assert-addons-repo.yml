---
# include_tasks helper (only when a NEW pool is about to be built, or
# apply-plan is forcing a reapply - see _resolve-pool.yml's `_pool_apply_spec`
# gate on the caller) - fails fast, before any pool pod that would depend on
# odoo.addons_repo_url/odoo.addons_repo_ref or any odoo.oca_repos entry
# actually working exists at all. Same instinct as _assert-init-modules.yml
# ("fail fast rather than deep inside a batch-low Job"), applied one level
# earlier: that check verifies a TENANT's init_modules (and their full
# dependency closure) exist in an addons path assumed to be usable at all;
# this one verifies every repo/ref backing that addons path - the tenant's
# private repo AND every public OCA repo - resolves and is usable in the
# first place. `_fileops_clone_addons: true` below clones ALL of them
# (private + every odoo.oca_repos entry) via job-fileops.yaml.j2's own
# loop, so this preflight covers every entry in that list automatically -
# nothing here needs to enumerate them itself except when naming which one
# failed (see the log-fetch loop and fail_msg below).
#
# Runs IN-CLUSTER (a Job, in the pattern of job-fileops.yaml.j2/
# _assert-init-modules.yml), not as a control-node `git`/`command` task -
# the deploy key this needs only exists as the addons-deploy-key Secret in
# the cluster; the control node has no access to it.
#
# Verified live (AWX job 118, odoo_action=deploy, plan=starter-tier-1): an
# addons_repo_ref that doesn't resolve put every pool pod in
# Init:CrashLoopBackOff on clone-addons with NOTHING in Ansible's own output
# naming the cause - _resolve-pool.yml's readyReplicas wait below just
# retried 60 times and timed out. This exists so that exact failure surfaces
# HERE, with the real cause and the fix in the message, instead of there.
- name: "Run the addons-repo preflight check [{{ pool_id }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: job-fileops.yaml.j2
  vars:
    _fileops_name: "check-addons-repo-{{ pool_id }}-{{ ansible_date_time.iso8601_basic_short | lower }}"
    _fileops_clone_addons: true
    # session_redis is not optional (pool-configmap.yaml.j2's
    # server_wide_modules = web,session_redis - see
    # 01-deploy-odoo-defaults.yml's comment on that module) - a ref that
    # resolves but lacks it would let clone-addons succeed and let THIS
    # check pass, only for Odoo itself to fail to start in the
    # {pool}-http/-cron/-gevent containers later. Checking for it here
    # keeps that failure in this Job's log, not the odoo container's.
    _fileops_command: >-
      if [ ! -d /addons/session_redis ]; then
        echo "MISSING: session_redis not found under /addons";
        exit 1;
      fi;
      echo OK
  register: _addonscheck_job

- name: "Wait for the addons-repo preflight check to complete [{{ pool_id }}]"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Job
    namespace: "{{ xayma_namespace }}"
    name: "{{ _addonscheck_job.result.metadata.name }}"
  register: _addonscheck_status
  until: >-
    _addonscheck_status.resources | length > 0 and
    (_addonscheck_status.resources[0].status.succeeded | default(0) | int > 0 or
     _addonscheck_status.resources[0].status.failed | default(0) | int > 0)
  retries: 30
  delay: 3

# Whichever container actually failed - clone-addons (odoo.addons_repo_ref
# doesn't resolve), one of the clone-oca-* containers (one odoo.oca_repos
# entry's ref doesn't resolve), or fileops (everything resolved but the
# tenant repo's tree lacks session_redis) - fetch all of them; exactly one
# will have real content. Looping over odoo.oca_repos here (not one
# hardcoded clone-oca-storage fetch) is what keeps this preflight actually
# useful once it clones more than one OCA repo - see 01-deploy-odoo-defaults.yml.
- name: "Fetch the clone-addons container's log on failure [{{ pool_id }}]"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "job-name={{ _addonscheck_job.result.metadata.name }}"
    container: clone-addons
  register: _addonscheck_clone_logs
  failed_when: false
  when: _addonscheck_status.resources[0].status.failed | default(0) | int > 0

- name: "Fetch each clone-oca-*'s log on failure [{{ pool_id }}]"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "job-name={{ _addonscheck_job.result.metadata.name }}"
    container: "clone-oca-{{ item.name }}"
  register: _addonscheck_oca_logs
  failed_when: false
  when: _addonscheck_status.resources[0].status.failed | default(0) | int > 0
  loop: "{{ odoo.oca_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Fetch the fileops container's log on failure [{{ pool_id }}]"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "job-name={{ _addonscheck_job.result.metadata.name }}"
    container: fileops
  register: _addonscheck_fileops_logs
  failed_when: false
  when: _addonscheck_status.resources[0].status.failed | default(0) | int > 0

# propagationPolicy explicit, NOT left to the API server's default - the
# default for a raw API delete (this module, and anything else that isn't
# `kubectl` itself) is Orphan, not Background. `kubectl delete` only looks
# like it cleans up a Job's Pods because kubectl hard-codes Background
# propagation client-side - that's a kubectl behavior, not a server
# default. Without this, the Job object goes away but its Pod's
# ownerReference dangles and nothing ever cleans it up (a bare Pod has no
# TTL of its own) - this is why check-addons-repo-* Pods were observed
# surviving for hours after their Job had already been "deleted". `wait:
# true` so this task actually confirms the deletion completed instead of
# just accepting the request and moving on.
- name: "Delete the addons-repo preflight check Job [{{ pool_id }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ xayma_namespace }}"
    name: "{{ _addonscheck_job.result.metadata.name }}"
    delete_options:
      propagationPolicy: Background
    wait: true

- name: "Assert the addons-repo preflight check succeeded [{{ pool_id }}]"
  ansible.builtin.assert:
    that: _addonscheck_status.resources[0].status.succeeded | default(0) | int > 0
    fail_msg: >-
      Pool {{ pool_id }} cannot be built from its current addons sources.
      Either odoo.addons_repo_url ({{ odoo.addons_repo_url }}) does not
      resolve at odoo.addons_repo_ref ({{ odoo.addons_repo_ref }}) - push a
      commit to it, or correct odoo.addons_repo_ref - or that tree is
      missing session_redis (vendor it from
      camptocamp/odoo-cloud-platform's 19.0 branch, the same source
      01-deploy-odoo-defaults.yml cites for Redis session config, or push
      it to this repo directly) - or one of odoo.oca_repos does not
      resolve at its pinned ref: {% for repo in odoo.oca_repos %}{{ repo.name }} ({{ repo.url }} @ {{ repo.ref }}){{ ', ' if not loop.last else '' }}{% endfor %}
      - bump that entry's ref in 01-deploy-odoo-defaults.yml. clone-addons
      log: {{ _addonscheck_clone_logs.log | default('(no logs captured)') }}
      {% for r in _addonscheck_oca_logs.results | default([]) %}clone-oca-{{ r.item.name }}
      log: {{ r.log | default('(no logs captured)') }}
      {% endfor %}fileops log:
      {{ _addonscheck_fileops_logs.log | default('(no logs captured)') }}
