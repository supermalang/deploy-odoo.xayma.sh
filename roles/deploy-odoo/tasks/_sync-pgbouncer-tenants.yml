---
# include_tasks helper - regenerates the FULL pgbouncer-tenants ConfigMap
# (one `[databases]` line per live tenant, each with its own
# `tenant_db_max_connections` cap - see vars/main.yml's header comment on
# why PgBouncer needs per-tenant entries at all) from every live tenant
# IngressRoute's annotation, then RELOADs PgBouncer so the change takes
# effect without dropping existing connections. A FULL REPLACE, not an
# incremental patch - concurrent tenant deploys touching this ConfigMap can
# never race or corrupt each other's entry.
#
# Optional overrides let the caller inject/override the CURRENT tenant's
# entry even before its own IngressRoute carries the annotation yet
# (deploy-tenant.yml, mid-creation) or before it's been updated
# (change-plan.yml): `_pgb_override_slug` + `_pgb_override_cap`.
# delete-tenant.yml needs no override - its IngressRoute is already gone by
# the time this runs, so the tenant naturally drops out of the list.

- name: "List every live tenant IngressRoute"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: IngressRoute
    api_version: traefik.io/v1alpha1
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "xayma.sh/customer"
  register: _pgb_tenants_raw

# NOT map(attribute='xayma.sh/instance')/map(attribute=tenant_db_max_connections_annotation_key)
# - Jinja's map(attribute=...) SPLITS the attribute string on '.' and does
# a nested attribute/key lookup per segment (documented Jinja2 behavior,
# the same mechanism that lets map(attribute='metadata.labels') reach two
# levels deep in the original version of this task). A label/annotation
# KEY that itself contains a literal '.' - every key in this codebase, by
# k8s convention ("xayma.sh/...") - gets misread as a nested path instead
# of one literal key: "xayma.sh/instance" becomes
# labels['xayma']['sh/instance'], which fails with "'dict object' has no
# attribute 'xayma'" the moment there is at least one resource to
# evaluate it against (an empty resource list never evaluates the getter
# at all, which is exactly why this stayed hidden through every deploy
# attempt where this tenant's own IngressRoute - matched by the SAME
# query above - didn't exist yet). See check-snapshot-freshness.yml's
# identical fix for the same root cause.
#
# NOT a single {{ dict(...) }} expression built from a Jinja list
# comprehension either - Jinja has no such syntax (`[x for x in y]` is
# Python-only; Jinja's equivalent is the {% for %} STATEMENT tag, which
# can only ever render to a STRING, never hand back a native dict/list
# object - confirmed the hard way, this raised a TemplateSyntaxError on
# the very first attempt). Building the dict INCREMENTALLY via `combine`
# across a real Ansible `loop:` keeps every value a plain, single-expression
# Jinja lookup (bracket subscript, no `.`-splitting, no control-flow tags
# to fight the native-type templating that lets `combine()` return an
# actual dict instead of dict-shaped text).
- name: "Initialize the tenant slug -> cap map (so a zero-tenant platform still ends with {}, not undefined)"
  ansible.builtin.set_fact:
    _pgb_tenant_caps: {}

- name: "Build the tenant slug -> cap map from live annotations"
  ansible.builtin.set_fact:
    _pgb_tenant_caps: >-
      {{ _pgb_tenant_caps | combine({
           item.metadata.labels['xayma.sh/instance']:
             item.metadata.annotations[tenant_db_max_connections_annotation_key]
         }) }}
  loop: "{{ _pgb_tenants_raw.resources }}"
  loop_control:
    label: "{{ item.metadata.labels['xayma.sh/instance'] }}"

- name: "Overlay this call's tenant, if given"
  ansible.builtin.set_fact:
    _pgb_tenant_caps: "{{ _pgb_tenant_caps | combine({_pgb_override_slug: _pgb_override_cap | string}) }}"
  when: _pgb_override_slug is defined

- name: "Render + apply the pgbouncer-tenants ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: pgbouncer-tenants-configmap.yaml.j2

# Only relevant on/near first-ever bootstrap (pgbouncer's pod may still be
# starting) - every later call finds it already Ready near-instantly.
- name: "Wait for the PgBouncer pod to be Ready before reloading it"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Pod
    namespace: "{{ xayma_namespace }}"
    name: "{{ pgbouncer_pod_name }}"
  register: _pgb_pod
  until: >-
    _pgb_pod.resources | length > 0 and
    _pgb_pod.resources[0].status.containerStatuses | default([])
    | selectattr('ready', 'equalto', true) | list | length > 0
  retries: 30
  delay: 5

# PgBouncer reloads its config (including %include'd files) on SIGHUP,
# equivalent to the admin console's RELOAD command, without dropping
# already-open connections - avoids needing a psql client inside the
# (minimal) PgBouncer image just to run RELOAD. Assumes pgbouncer is PID 1
# in its container, true for the pinned edoburu/pgbouncer image.
#
# Shells out to the real `kubectl` binary rather than
# kubernetes.core.k8s_exec (which goes through the Python `kubernetes`
# client library, a different code path against the same API) - confirmed
# live, twice, on two separate tenant deploys: the module's exec
# consistently fails with a truncated "OCI runtime exec failed: exec
# failed: unabl..." while the IDENTICAL command via plain `kubectl exec`
# (same pod, same container, same args) succeeds every time. Not this
# role's bug to fix - just not worth depending on a module with a live,
# reproducible incompatibility here when the working alternative is this
# cheap.
- name: "RELOAD PgBouncer so the new tenant caps take effect"
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubeconfig_path }}"
      - -n
      - "{{ xayma_namespace }}"
      - exec
      - "{{ pgbouncer_pod_name }}"
      - -c
      - pgbouncer
      - --
      - kill
      - -HUP
      - "1"
  changed_when: false
