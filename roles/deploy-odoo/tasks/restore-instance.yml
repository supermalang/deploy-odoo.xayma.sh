---
# Restore a snapshot identified by `snapshot_id` (required extra_var; the
# timestamp prefix produced by a daily/ad-hoc snapshot) and `snapshot_kind`
# (daily|adhoc, defaults to daily). Odoo is scaled down for the duration and
# back up afterwards; Postgres stays up throughout (the restore Job connects
# to it directly to drop/recreate the DB).
- name: Assert snapshot_id was provided
  ansible.builtin.assert:
    that: snapshot_id is defined and snapshot_id | length > 0
    fail_msg: "action=restore requires -e snapshot_id=<timestamp> (and optionally snapshot_kind=daily|adhoc)."

- name: Scale the Odoo Deployment down for the restore
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ customer_slug }}"
    name: "{{ instance_name }}"
    replicas: 0
    wait: true

- name: Apply the restore Job
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ customer_slug }}"
    template: restore-job.yaml.j2
  register: _restore_job

- name: Wait for the restore Job to complete
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Job
    namespace: "{{ customer_slug }}"
    name: "{{ _restore_job.result.metadata.name }}"
  register: _restore_job_status
  until: >-
    _restore_job_status.resources | length > 0 and
    (_restore_job_status.resources[0].status.succeeded | default(0) | int > 0 or
     _restore_job_status.resources[0].status.failed | default(0) | int > 0)
  retries: 120
  delay: 10

- name: Scale the Odoo Deployment back up
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ customer_slug }}"
    name: "{{ instance_name }}"
    replicas: 1
    wait: false

- name: Assert the restore Job succeeded
  ansible.builtin.assert:
    that: _restore_job_status.resources[0].status.succeeded | default(0) | int > 0
    fail_msg: >-
      Restore Job {{ _restore_job.result.metadata.name }} failed - check its
      pod logs. Odoo has been scaled back up regardless; verify data before
      directing traffic to it if the restore did not complete cleanly.
