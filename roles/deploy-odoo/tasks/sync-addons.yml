---
# Namespace/pool-scoped auxiliary action - a git pull onto the SHARED
# addons PVC, mounted read-only by every pool pod (see README). Dispatched
# in main.yml BEFORE the tenant identity/vault asserts: this action carries
# no customer/instancename/version/plan at all.
- name: Assert addons_repo_url was provided
  ansible.builtin.assert:
    that: addons_repo_url is defined and addons_repo_url | length > 0
    fail_msg: "odoo_action=sync-addons requires -e addons_repo_url=<git URL> (and optionally addons_repo_ref, default 'main')."

# This role's platform bootstrap (_ensure-platform.yml) is what creates the
# addons PVC - sync-addons deliberately does NOT run that whole bootstrap
# just to populate a git checkout, so fail fast with a clear pointer instead
# of doing it implicitly as a side effect.
- name: Check that the xayma-odoo namespace already exists
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Namespace
    name: "{{ xayma_namespace }}"
  register: _syncaddons_namespace

- name: Assert the platform has been bootstrapped at least once
  ansible.builtin.assert:
    that: _syncaddons_namespace.resources | length > 0
    fail_msg: >-
      Namespace {{ xayma_namespace }} does not exist yet - run
      odoo_action=deploy for at least one tenant first (it bootstraps the
      addons PVC via _ensure-platform.yml), then retry sync-addons.

- name: Apply the sync-addons Job
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: job-sync-addons.yaml.j2
  register: _syncaddons_job

- name: Wait for the sync-addons Job to complete
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Job
    namespace: "{{ xayma_namespace }}"
    name: "{{ _syncaddons_job.result.metadata.name }}"
  register: _syncaddons_job_status
  until: >-
    _syncaddons_job_status.resources | length > 0 and
    (_syncaddons_job_status.resources[0].status.succeeded | default(0) | int > 0 or
     _syncaddons_job_status.resources[0].status.failed | default(0) | int > 0)
  retries: 60
  delay: 5

- name: Surface the sync-addons Job's pod logs on failure
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig_path }}"
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "job-name={{ _syncaddons_job.result.metadata.name }}"
  register: _syncaddons_job_logs
  when: _syncaddons_job_status.resources[0].status.failed | default(0) | int > 0

- name: Assert the sync-addons Job succeeded
  ansible.builtin.assert:
    that: _syncaddons_job_status.resources[0].status.succeeded | default(0) | int > 0
    fail_msg: >-
      {{ _syncaddons_job.result.metadata.name }} failed - pod logs:
      {{ _syncaddons_job_logs.log | default('(no logs captured)') }}
