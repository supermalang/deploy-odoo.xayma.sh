---
# Changes the tenant's custom domain (the default host always stays
# attached) without disturbing its current running/suspended/stopped state
# or pool assignment - both recovered from live state first, same technique
# _recover-tenant.yml uses everywhere else. Adapted to the wildcard-cert
# reality: only a CHANGE to custom_domain touches a Certificate at all (the
# default host is always covered by the platform wildcard).
- name: Recover this tenant's current pool/state from live cluster facts
  ansible.builtin.import_tasks: _recover-tenant.yml

- name: "Resolve the platform's edge IP (via the default host) [{{ tenant_name }}]"
  ansible.builtin.set_fact:
    _edit_platform_ip: "{{ lookup('community.general.dig', default_domain) }}"
  when: custom_domain | default('') | length > 0

- name: "Resolve the requested custom domain [{{ tenant_name }}]"
  ansible.builtin.set_fact:
    _edit_custom_domain_ip: "{{ lookup('community.general.dig', custom_domain) }}"
  when: custom_domain | default('') | length > 0

- name: "Assert the custom domain points at this platform [{{ tenant_name }}]"
  ansible.builtin.assert:
    that: _edit_custom_domain_ip == _edit_platform_ip
    fail_msg: >-
      custom_domain ({{ custom_domain }}) resolves to
      {{ _edit_custom_domain_ip }}, not this platform's edge IP
      ({{ _edit_platform_ip }}, resolved via {{ default_domain }}). Point
      its DNS record at the platform before retrying.
  when: custom_domain | default('') | length > 0

- name: "Apply the tenant's custom-domain Certificate [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-certificate.yaml.j2
  when: custom_domain | default('') | length > 0

- name: "Remove the custom-domain Certificate + IngressRoute + hostrewrite Middleware (custom_domain cleared) [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ xayma_namespace }}"
    name: "{{ item.name }}"
  loop:
    - {api_version: cert-manager.io/v1, kind: Certificate, name: "{{ tenant_name }}-tls"}
    - {api_version: traefik.io/v1alpha1, kind: IngressRoute, name: "{{ tenant_name }}-custom"}
    - {api_version: traefik.io/v1alpha1, kind: Middleware, name: "{{ tenant_hostrewrite_mw_name }}"}
  loop_control:
    label: "{{ item.kind }}"
  when: custom_domain | default('') | length == 0

# version/plan are NOT set here (see tenant-ingressroute.yaml.j2's header
# comment) - edit-domain never changes pool assignment either, same reason
# as _set-tenant-state.yml.
- name: "Reapply the IngressRoute for the new domain set [{{ tenant_name ~ ' (' ~ tenant_state ~ ')' }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-ingressroute.yaml.j2
  vars:
    instance_state: "{{ tenant_state }}"
    ingress_pool_http_name: "{{ tenant_pool_id }}-http"
    ingress_pool_gevent_name: "{{ tenant_pool_id }}-gevent"
    tenant_assignment_pool_id: "{{ tenant_pool_id }}"
    tenant_assignment_version: "{{ tenant_version }}"
    tenant_assignment_plan: "{{ tenant_plan }}"
