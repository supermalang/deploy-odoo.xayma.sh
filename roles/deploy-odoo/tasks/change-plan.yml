---
# Moves a tenant to a different plan on the SAME Odoo version (assert
# below; a version change is out of scope for this role entirely - see
# README "Non-goals"). `plan` is the NEW target plan name (extra_var,
# slug-validated by _assert-plan.yml in main.yml); `plan_spec`/
# `plan_spec_json` (optional) is the NEW target's spec, resolved with the
# same precedence as deploy (see README "Plan resolution"). No data
# movement: the tenant's database/filestore directory are untouched, only
# which pool serves them (and its cap/ratelimit) changes.
- name: Recover this tenant's current pool/state from live cluster facts
  ansible.builtin.import_tasks: _recover-tenant.yml

- name: "Log the pool move [{{ tenant_name }}]"
  ansible.builtin.debug:
    msg: >-
      Moving {{ tenant_name }} from plan={{ tenant_plan }} to plan={{ plan }}
      on odoo{{ tenant_version }} ({{ tenant_pool_id }} -> odoo{{ tenant_version }}-{{ plan }}).
      version is never taken as input for change-plan - a cross-version
      move is out of scope for this role entirely (see README
      "Non-goals").

# `version` is meant to stay pinned to tenant_version below - it is NOT
# real input for change-plan, ever (see the comment above and README
# "Actions"). But version IS an AWX survey field with a default, and
# extra_vars ALWAYS win over set_fact/task vars (no in-play mechanism can
# override them) - so if the survey sends one that doesn't match
# tenant_version (which it will, by default, on every call through the
# one shared Job Template), the `vars: version: tenant_version` overrides
# on _resolve-plan-spec.yml/_resolve-pool.yml below are silently
# ineffective, and this could resolve/create/target an entirely different
# (wrong-version) pool. This guard only catches the mismatch loudly - it
# does NOT fix _resolve-pool.yml's own dependency on the plain `version`/
# `plan` vars, which would need the same caller-supplied-name treatment
# job-fixup.yaml.j2/tenant-ingressroute.yaml.j2 got, applied through
# vars/main.yml's whole pool_id/pool_http_name/pool_pg_role/... chain -
# a larger, separate change, not done here.
- name: "Assert no survey-supplied version silently targets the wrong pool [{{ tenant_name }}]"
  ansible.builtin.assert:
    that: version is not defined or (version | string) == (tenant_version | string)
    fail_msg: >-
      version extra_var ({{ version | default('undefined') }}) does not
      match this tenant's actual current version ({{ tenant_version }}).
      Do not send version when launching odoo_action=change-plan - it is
      never real input for this action and this run must not proceed with
      a mismatched one silently targeting the wrong pool.

# Resolve the TARGET plan_spec + ensure the TARGET pool exists (create-only
# semantics apply - see _resolve-pool.yml). `version` is forced to the
# tenant's CURRENT (unchanged) version for both imports below - a task-vars
# override that ONLY holds because the assert above has already guaranteed
# version (if the survey sent one) already equals tenant_version; it is
# not, by itself, a fix for the general problem (see comment above).
- name: Resolve the effective plan_spec
  ansible.builtin.import_tasks: _resolve-plan-spec.yml
  vars:
    version: "{{ tenant_version }}"
- name: Resolve (or create) this tenant's pool
  ansible.builtin.import_tasks: _resolve-pool.yml
  vars:
    version: "{{ tenant_version }}"

- name: "REVOKE the old pool role's CONNECT on this tenant's database [{{ tenant_name }}]"
  community.postgresql.postgresql_privs:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    database: postgres
    type: database
    objs: "{{ instance_slug }}"
    privs: CONNECT
    roles: "{{ tenant_pg_role }}"
    state: absent

- name: "GRANT the new pool role's CONNECT on this tenant's database [{{ tenant_name }}]"
  community.postgresql.postgresql_privs:
    login_host: "{{ pg_conn_host }}"
    login_user: postgres
    login_password: "{{ _pg_superuser_password }}"
    database: postgres
    type: database
    objs: "{{ instance_slug }}"
    privs: CONNECT
    roles: "pool_{{ tenant_version }}_{{ plan }}"
    state: present

- name: "Update this tenant's PgBouncer per-db entry to the new plan's cap [{{ tenant_name }}]"
  ansible.builtin.include_tasks: _sync-pgbouncer-tenants.yml
  vars:
    _pgb_override_slug: "{{ instance_slug }}"
    _pgb_override_cap: "{{ tenant_spec.tenant_db_max_connections }}"

# pool_id/pool_http_name/pool_gevent_name are NOT used here (see
# tenant-ingressroute.yaml.j2's header comment) - the NEW pool id is built
# directly from tenant_version (pinned, guarded above) + plan (the real,
# intended target extra_var - this is the one legitimate case where `plan`
# SHOULD win from extra_vars), matching vars/main.yml's own
# pool_id/pool_http_name/pool_gevent_name formula.
- name: "Patch the ratelimit Middleware + IngressRoute to the new pool/spec [{{ tenant_name }}]"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ xayma_namespace }}"
    template: tenant-ingressroute.yaml.j2
  vars:
    instance_state: "{{ tenant_state }}"
    custom_domain: "{{ tenant_custom_domain }}"
    ingress_pool_http_name: "odoo{{ tenant_version }}-{{ plan }}-http"
    ingress_pool_gevent_name: "odoo{{ tenant_version }}-{{ plan }}-gevent"
    tenant_assignment_pool_id: "odoo{{ tenant_version }}-{{ plan }}"
    tenant_assignment_version: "{{ tenant_version }}"
    tenant_assignment_plan: "{{ plan }}"

# If the OLD pool just lost its last tenant, scale it to 0 (never delete its
# objects) - same rule delete-tenant.yml applies.
- name: "Count remaining tenants on the old pool [{{ tenant_name ~ ' on ' ~ tenant_pool_id }}]"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: IngressRoute
    api_version: traefik.io/v1alpha1
    namespace: "{{ xayma_namespace }}"
    label_selectors:
      - "xayma.sh/pool-id={{ tenant_pool_id }}"
  register: _changeplan_old_pool_tenants

- name: "Scale the old pool to 0 (no tenants remain) [{{ tenant_name ~ ' on ' ~ tenant_pool_id }}]"
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ xayma_namespace }}"
    name: "{{ item }}"
    replicas: 0
    wait: false
  loop:
    - "{{ tenant_pool_id }}-http"
    - "{{ tenant_pool_id }}-cron"
    - "{{ tenant_pool_id }}-gevent"
  loop_control:
    label: "{{ item }}"
  when: _changeplan_old_pool_tenants.resources | length == 0
