---
# Ad-hoc snapshot: apply the one-shot Job (its own quota+retention logic is
# inside snapshot-job.yaml.j2) and wait for it to complete. A quota breach
# fails the Job (and this task) with a clear message from the container log.
- name: Apply the ad-hoc snapshot Job
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    namespace: "{{ customer_slug }}"
    template: snapshot-job.yaml.j2
  register: _snapshot_job

- name: Wait for the ad-hoc snapshot Job to complete
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Job
    namespace: "{{ customer_slug }}"
    name: "{{ _snapshot_job.result.metadata.name }}"
  register: _snapshot_job_status
  until: >-
    _snapshot_job_status.resources | length > 0 and
    (_snapshot_job_status.resources[0].status.succeeded | default(0) | int > 0 or
     _snapshot_job_status.resources[0].status.failed | default(0) | int > 0)
  retries: 60
  delay: 10

- name: Assert the ad-hoc snapshot Job succeeded
  ansible.builtin.assert:
    that: _snapshot_job_status.resources[0].status.succeeded | default(0) | int > 0
    fail_msg: >-
      Ad-hoc snapshot Job {{ _snapshot_job.result.metadata.name }} failed
      (likely the adhoc_allowed quota) - check its pod logs.
