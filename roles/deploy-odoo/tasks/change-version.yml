---
# Out of scope for this role (see README "Non-goals") - a major-version
# migration needs Odoo's own upgrade tooling against a copied database, not
# an in-place pool reassignment. Fails fast with a clear message rather
# than silently doing nothing or (worse) something destructive.
- name: Change-version is not implemented
  ansible.builtin.fail:
    msg: >-
      odoo_action=change-version (major-version migration) is out of scope
      for this role - see README "Non-goals". Suggested manual path: take a
      safety backup (odoo_action=backup), deploy a NEW tenant on the target
      version's pool, restore a copy of the database into it, run Odoo's
      own upgrade util, validate, then cut DNS/IngressRoute over and
      odoo_action=delete the old tenant.
