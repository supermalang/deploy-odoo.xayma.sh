---
# FALLBACK plan catalog for shared Odoo pools (see README "Plan
# resolution"). The Xayma app is now the source of truth: every real launch
# sends `plan` (a name) AND `plan_spec` (the full nested spec dict) as
# extra_vars - this catalog is consulted ONLY when plan_spec is absent
# (manual CLI/AWX-survey runs that only set `plan`). Precedence, resolved by
# tasks/_resolve-plan-spec.yml:
#   plan_spec (app/extra_var) > plans[plan] (this catalog) >
#   plan_spec_hard_fallback (defaults/main/01-deploy-odoo-defaults.yml, used
#   when `plan` doesn't even match a catalog entry)
#
# This replaces the earlier "role owns the plan catalog by name, app never
# sends sizing" doctrine: the app now owns the commercial AND physical spec
# (it already has to represent plan sizing somewhere for its own billing/UI,
# so duplicating it here as the single source of truth removes a
# synchronization problem) - the role's copy here exists purely as a
# manual-run safety net, not as the thing real launches rely on.
#
# Schema (exact key names - see README "Plan resolution" for the pool-scoped
# vs tenant-scoped split and what each governs):
#   workers, replicas_min, replicas_max     - POOL-scoped
#   pod: {cpu_request, cpu_limit, mem_request, mem_limit}   - POOL-scoped
#   limits: {mem_soft, mem_hard, time_cpu, time_real, request}  - POOL-scoped
#   cron: {threads}                         - POOL-scoped
#   db_maxconn                              - POOL-scoped (odoo.conf db_maxconn,
#                                              per-worker-process PG demand -
#                                              NOT the same lever as
#                                              tenant_db_max_connections below)
#   init_modules                            - TENANT-scoped
#   tenant_db_max_connections               - TENANT-scoped (PgBouncer's
#                                              per-tenant-database cap - THE
#                                              real per-tenant throttle)
#   ratelimit: {avg, burst}                 - TENANT-scoped
#
# POOL-scoped keys are CREATE-ONLY (see tasks/_resolve-pool.yml) - they are
# only applied the first time a given (version, plan) pool is created;
# changing them here later does NOT resize an existing pool. Resizing an
# existing pool is odoo_action=apply-plan.
#
# limits.mem_hard is 0 (disabled) on every plan below, not a small nonzero
# number - see pool-configmap.yaml.j2's limit_memory_hard comment for the
# live incident (RLIMIT_AS killing aiobotocore's SSL-context setup on every
# S3 filestore write) that this default is chosen to avoid. The pod's own
# cgroup memory.max (pod.mem_limit) plus limit_memory_soft (RSS-based,
# graceful worker recycling) are what actually enforce memory here now.
#
# Every plan below keeps a `plan_sizing_master_overhead_bytes` (see
# defaults/main/01-deploy-odoo-defaults.yml) margin between
# `workers * limits.mem_soft` and `pod.mem_limit` - enforced by
# tasks/_assert-plan-spec.yml's cross-field invariant, not just eyeballed
# here; kept consistent across plans so that invariant has the same
# 128Mi margin everywhere, tier differences coming from worker COUNT
# (more concurrent request handlers) rather than per-worker RSS budget.
#
# `minimal` is not just a manual-run/misconfiguration safety net (that
# role is now literally this dict - see plan_spec_hard_fallback in
# 01-deploy-odoo-defaults.yml, which points straight at it) - it is ALSO
# the FLOOR every other plan's numeric fields get clamped up to if an
# externally-supplied plan_spec (the Xayma app, or a manual
# plan_spec_json) sends something smaller (see
# tasks/_clamp-plan-spec.yml). Every number here is deliberately the
# smallest value this platform considers safe to run at all, not a
# real commercial tier.
plans:
  minimal:
    workers: 2
    replicas_min: 1
    replicas_max: 2
    pod:
      cpu_request: "150m"
      cpu_limit: "1"
      mem_request: "384Mi"
      mem_limit: "768Mi"
    limits:
      mem_soft: 268435456         # 256Mi - 2 workers * 256Mi + 128Mi master overhead = 768Mi = pod.mem_limit above, exactly
      mem_hard: 0                 # disabled - see header comment
      time_cpu: 120
      time_real: 300
      request: 8196
    cron:
      threads: 1
    db_maxconn: 5
    init_modules: "base"
    tenant_db_max_connections: 5
    ratelimit:
      avg: 5
      burst: 15
  standard:
    workers: 2
    replicas_min: 1
    replicas_max: 4
    pod:
      cpu_request: "250m"
      cpu_limit: "1"
      mem_request: "512Mi"
      mem_limit: "1Gi"
    limits:
      mem_soft: 402653184         # 384Mi - 2 workers * 384Mi + 128Mi master overhead = 896Mi, below pod.mem_limit (1Gi) above
      mem_hard: 0                 # disabled - see header comment
      time_cpu: 120
      time_real: 300
      request: 8196
    cron:
      threads: 1
    db_maxconn: 8
    init_modules: "base,account,contacts,l10n_sn"
    tenant_db_max_connections: 10
    ratelimit:
      avg: 10
      burst: 30
  premium:
    workers: 4
    replicas_min: 2
    replicas_max: 6
    pod:
      cpu_request: "500m"
      cpu_limit: "2"
      mem_request: "1Gi"
      mem_limit: "2Gi"
    limits:
      mem_soft: 469762048         # 448Mi - 4 workers * 448Mi + 128Mi master overhead = 1920Mi, below pod.mem_limit (2Gi) above
      mem_hard: 0                 # disabled - see header comment
      time_cpu: 120
      time_real: 300
      request: 8196
    cron:
      threads: 2
    db_maxconn: 16
    init_modules: "base,account,contacts,l10n_sn,sale_management,purchase"
    tenant_db_max_connections: 20
    ratelimit:
      avg: 25
      burst: 75
