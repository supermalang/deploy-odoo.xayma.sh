---
# defaults file for deploy-odoo (k3s) - SHARED MULTI-TENANT POOL MODEL.
#
# Replaces the old per-slice model (one Deployment+StatefulSet per instance).
# See README.md "Migrating from the slice model" for the full contract
# diff. Architecture:
#   - ONE namespace (`xayma_namespace`) for the whole tier - no more
#     per-customer namespaces.
#   - A tenant is a Postgres database + filestore directory + IngressRoute
#     (+ Certificate only for custom_domain) - never a workload of its own.
#   - Compute is organized in POOLS keyed by (version, plan); see
#     00-plans.yml for the plan catalog and vars/main.yml for pool_id.
#
# This role is still a STATELESS EXECUTOR for tenant identity: it derives
# every secret deterministically from vault "seeds" (vars/main.yml) rather
# than persisting anything per-tenant/per-pool. It is NO LONGER stateless
# about SIZING - see 00-plans.yml's header comment for why the plan catalog
# now lives in this role (a deliberate reversal of the old slice-model
# doctrine, documented in the README).

xayma_odoo:
  organization: "xayma"
  instancename: "sandbox"
  version: "19"
  plan: "standard"

# Role defaults are the LOWEST-precedence variable layer, so extra_vars from
# the AWX job (or -e on the CLI) cleanly override these - no self-reference,
# unlike trying to do this in vars/main.yml (see that file's header comment).
customer: "{{ xayma_odoo.organization }}"
instancename: "{{ xayma_odoo.instancename }}"
version: "{{ xayma_odoo.version }}"
plan: "{{ xayma_odoo.plan }}"
custom_domain: ""    # optional additional domain; blank = default host only

# --- Platform-wide seam vars ---
# Same contract as install-platform.xayma.sh's group_vars/all/main.yml, kept
# as plain role defaults for now (this role is deployed from its own AWX
# job, not the platform's site.yml).
kubeconfig_path: /etc/rancher/k3s/k3s.yaml
cluster_issuer: letsencrypt-production
platform_domain: xayma.net

# A wildcard Certificate (*.{{ platform_domain }}) can ONLY be issued via
# ACME DNS-01 - HTTP-01 (what `cluster_issuer` above is) cannot validate a
# wildcard name at all, full stop, it's an ACME protocol limitation, not a
# config choice. `letsencrypt-dns01-production` is the DNS-01-capable
# ClusterIssuer added to install-platform.xayma.sh for exactly this - see
# README.md "Migrating from the slice model". Left pointing at an HTTP-01
# issuer, the wildcard Certificate k8s object applies fine but cert-manager
# never actually issues it.
wildcard_cluster_issuer: letsencrypt-dns01-production

# ONE namespace for the entire tier (was one namespace per customer).
xayma_namespace: xayma-odoo

# Postgres topology seam - only 'shared' (one Postgres for the whole tier)
# is implemented; 'per_version'/'per_pool' are reserved names so a future
# change only has to teach vars/main.yml's `pg_target` a new branch, never
# the task files (see tasks/_assert-plan.yml, which fails fast on anything
# else today).
pg_topology: shared

# --- Plan resolution (see README "Plan resolution") ---
# The Xayma app is the source of truth: real launches send `plan` (name) +
# `plan_spec` (the full nested dict, same schema as defaults/main/00-plans.yml)
# as extra_vars. `plan_spec_hard_fallback` is the LAST-resort layer - used
# only when a manual/CLI run sets `plan` to a name that isn't even in the
# 00-plans.yml catalog and sends no plan_spec/plan_spec_json either. It is
# deliberately conservative (this is a safety net, not a real tier).
#
# This whole model replaces the old flat `plan_*` extra_vars contract - that
# doctrine existed to keep AWX surveys simple (flat fields only); the app
# now sends `plan_spec` as a real nested JSON value over the AWX API
# directly, so there is no longer a reason to flatten it. The ONE manual-run
# survey field that remains is `plan_spec_json` (a JSON string, parsed by
# tasks/_resolve-plan-spec.yml) - see README "AWX".
plan_spec_hard_fallback:
  workers: 2
  replicas_min: 1
  replicas_max: 2
  pod:
    cpu_request: "150m"
    cpu_limit: "1"
    mem_request: "384Mi"
    mem_limit: "768Mi"
  limits:
    mem_soft: 402653184         # 384Mi - keep BELOW pod.mem_limit above
    mem_hard: 536870912         # 512Mi - keep BELOW pod.mem_limit above
    time_cpu: 120
    time_real: 300
    request: 8196
  cron:
    threads: 1
  db_maxconn: 5
  init_modules: "base"
  tenant_db_max_connections: 5
  ratelimit:
    avg: 5
    burst: 15

# --- Role-owned, non-plan defaults ---
odoo:
  storage_class: local-path

  # Namespace-wide singleton PVCs (was per-instance) - sized generously since
  # every tenant now shares them; resizing is a manual PVC edit (local-path's
  # online-expansion support depends on the underlying filesystem - verify
  # before relying on it).
  filestore_storage: 50Gi
  addons_storage: 5Gi

  # Platform MinIO (internal, snapshot target for backup/restore) - endpoint/
  # bucket match install-platform.xayma.sh's deploy-minio role (one MinIO,
  # in xayma-storage), but the credential is the scoped `xayma.snapshots`
  # user, NOT the platform root user - it can only Get/Put/Delete objects
  # and list this one bucket.
  storage_namespace: xayma-storage
  snapshot_bucket: snapshots
  snapshot_endpoint: "http://minio.xayma-storage.svc:9000"
  # A fixed identity, not a secret - deliberately a plain default, not
  # vaulted (see 02-credentials.yml.example for why).
  snapshot_access_key: "xayma.snapshots"
  snapshot_secret_key: "{{ vault_odoo_snapshot_secret_key }}"

  # odoo_action=sync-addons (git pull onto the addons PVC). No default repo
  # URL on purpose: it must be supplied per-run (-e addons_repo_url=...)
  # since it is credential-adjacent - see tasks/sync-addons.yml.
  addons_repo_ref: main

  # Integrity guards for odoo_action=backup (templates/job-backup.yaml.j2) -
  # `sh` is dash, which has no `pipefail`, so `pg_dump | gzip > file` used to
  # report gzip's exit status: a failed pg_dump still produced a "successful"
  # ~20-byte empty gzip that rclone then happily uploaded. The dump script now
  # runs under bash with `set -euo pipefail` AND stats its own output against
  # this floor, deleting + failing rather than letting a too-small dump reach
  # MinIO. The identical bug silently replaced every nightly Postgres backup
  # in install-platform.xayma.sh between 2026-07-26 and 2026-08-01 - see that
  # repo's deploy-databases role for the fix this one is ported from.
  backup:
    min_dump_bytes: 1024
    # A legitimate empty-filestore tenant's tar.gz is ~110 bytes (tar's
    # trailing null blocks survive gzip); a totally empty/failed gzip stream
    # is 20 bytes. This floor only needs to sit between the two.
    min_filestore_bytes: 64

# odoo_action=check-snapshot-freshness (tasks/check-snapshot-freshness.yml) -
# how stale a tenant's newest daily snapshot may be before the check fails
# (surfaced as an AWX Job failure -> the notification_templates_error wired
# in roles/configure-awx). One nightly cycle plus slack.
#
# max_age_hours only proves a snapshot is RECENT, not that it is VALID - a
# ~20-byte empty dump from the pipefail bug above would still pass this
# check. min_dump_bytes/min_filestore_bytes close that blind spot by having
# the freshness Job also assert object size (rclone lsl), not just recency.
snapshot_freshness:
  max_age_hours: 30
  min_dump_bytes: 1024
  min_filestore_bytes: 64

# Shared Postgres sizing (ONE StatefulSet for the whole tier - not a plan_*
# concern; see pg_topology above).
postgres:
  storage: 20Gi
  cpu_request: "500m"
  cpu_limit: "4"
  mem_request: "1Gi"
  mem_limit: "4Gi"
  max_connections: 200
  # Node-pinned DELIBERATELY (its PVC is local-path, single-node today) -
  # see README "Before adding node 2". Empty = scheduler's free choice on a
  # single-node cluster; set nodeSelector/affinity once a real node name is
  # known and node count > 1 is on the table.
  node_selector: {}

# PgBouncer (transaction-mode pooling in front of the shared Postgres).
pgbouncer:
  default_pool_size: 5
  max_client_conn: 2000
  cpu_request: "50m"
  cpu_limit: "500m"
  mem_request: "64Mi"
  mem_limit: "256Mi"

# Redis (mandatory Odoo session backend - no filesystem fallback). Verified
# against camptocamp/odoo-cloud-platform's session_redis addon, 19.0 branch
# (session.py/http.py) - it is configured ENTIRELY via ODOO_SESSION_REDIS_*
# environment variables on the odoo process (NOT odoo.conf keys - see
# pool-deployments.yaml.j2/job-init.yaml.j2/job-fixup.yaml.j2), and its
# session key prefix is set ONCE per pool (ODOO_SESSION_REDIS_PREFIX -
# there is no per-tenant/per-database segment in the Redis key at all,
# only in the stored session VALUE's `db` field) - see README "Known
# caveats" for why session purge has to filter by that field, not scan a
# tenant-specific key pattern.
redis:
  storage: 1Gi
  cpu_request: "50m"
  cpu_limit: "500m"
  mem_request: "64Mi"
  mem_limit: "256Mi"
  maxmemory: "192mb"
  maxmemory_policy: "allkeys-lru"

# The stock Docker Hub `odoo` image does NOT include the `redis` Python
# package that session_redis's http.py needs (`import redis`) - without it,
# the FIRST session access on any pool pod hits an AttributeError (the
# module catches the ImportError and continues with `redis = None`, then
# crashes on first real use, not at startup). `odoo_image_repo` must point
# at a registry repo (e.g. "yourdockerhubuser/xayma-odoo") that carries a
# `{version}.0`-tagged image built from files/odoo-image/Dockerfile (which
# layers `pip install redis` onto the stock image) - see
# tasks/_ensure-odoo-image.yml + odoo_image_build below for how that tag
# gets there automatically, and README "Requirements"/"Custom Odoo image".
odoo_image_repo: supermalang/xayma-odoo

# Automatic build+push of `{{ odoo_image_repo }}:{{ version }}.0` when it
# doesn't already exist in the registry (tasks/_ensure-odoo-image.yml,
# called from _resolve-pool.yml on every deploy/change-plan/apply-plan).
# Builds via `nerdctl` against k3s's OWN embedded containerd
# (`k3s_containerd_socket` below) - DELIBERATELY not a separate Docker
# daemon, since k3s already ships a container runtime and nerdctl is
# Docker-CLI-compatible against it directly. Needs `vault_odoo_dockerhub_username`/
# `vault_odoo_dockerhub_token` (an access token, not the account password)
# in the vault, and nerdctl-full installed on whatever host runs this
# playbook - see README "Requirements"/"Custom Odoo image". When disabled
# and the tag is missing, _ensure-odoo-image.yml fails fast with a clear
# message rather than letting every pool pod in a brand-new pool
# crash-loop on a missing/wrong image.
odoo_image_build:
  enabled: true

# k3s's embedded containerd - NOT the default `/run/containerd/containerd.sock`
# a standalone containerd/Docker install would use. `nerdctl_namespace` is
# the containerd namespace k3s's own kubelet/containerd use for every pod
# image - matching it here is just convention (harmless either way once
# the image is actually pushed to the registry, since kubelet pulls it
# fresh from there independently of this build).
k3s_containerd_socket: /run/k3s/containerd/containerd.sock
nerdctl_namespace: k8s.io

# Namespace ResourceQuota - a guardrail against Job pileups (batch-low Jobs
# are the main risk: init/fixup/restore/backup/sync-addons all land here).
resourcequota:
  pods: "200"
  requests_cpu: "16"
  requests_memory: "32Gi"
  limits_cpu: "32"
  limits_memory: "64Gi"

# PriorityClass for every Job this role creates (init/fixup/restore/backup/
# sync-addons) - negative so they never preempt pool workloads, and
# preemptionPolicy Never so a pending batch-low Job never preempts anything
# else while it waits either.
priorityclass:
  name: batch-low
  value: -100

# All component versions pinned explicitly - never `latest`.
versions:
  odoo: "19"                     # survey fallback only; real deploys pass `version` explicitly
  postgres: "16.6-bookworm"       # ONE shared StatefulSet for the tier (see pg_topology)
  # NOTE: edoburu/pgbouncer tags are v-prefixed from v1.23.0 onward (1.22.x
  # and earlier are not) - dropping the "v" yields a "not found"
  # ImagePullBackOff on docker.io, not a clear error.
  pgbouncer: "v1.23.1-p2"         # edoburu/pgbouncer
  redis: "7.4.1-alpine3.20"
  postgres_exporter: "v0.16.0"    # quay.io/prometheuscommunity/postgres-exporter
  busybox: "1.38.0"               # suspend-backend + config-merge initContainers
  rclone: "1.74.3"                # restore/backup Jobs -> platform MinIO
  git: "2.47.1"                   # sync-addons Job
