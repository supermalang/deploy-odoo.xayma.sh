<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 &mdash; Not Found</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a; color: #e2e8f0; text-align: center; padding: 2rem;
    }
    .code { font-size: 6rem; font-weight: 700; line-height: 1; margin: 0; color: #38bdf8; }
    .title { font-size: 1.5rem; margin: 0.5rem 0 0; font-weight: 500; }
    .hint { margin-top: 1rem; color: #94a3b8; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <p class="title">Not Found</p>
    <p class="hint">This page doesn't exist. Check the URL, or contact your Xayma administrator.</p>
  </main>
</body>
</html>
