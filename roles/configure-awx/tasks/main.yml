---
# Creates/updates the single app-facing Job Template `odoo-tenant` plus the
# nightly check-snapshot-freshness Schedule bound to it (see main README
# "AWX"). One Job Template, one queue, allow_simultaneous: false - every
# odoo_action for every tenant serializes through it. That is a deliberate
# choice, not a limitation nobody noticed: several task sequences in
# roles/deploy-odoo are read-then-write against shared/live cluster state
# (the pgbouncer-tenants ConfigMap rebuild, create-only pool bootstrap,
# pool scale-to-zero tenant counting, same-tenant state transitions) with
# no actual per-tenant or per-pool locking - only this template's serial
# queue prevents two of those sequences from ever running at the same
# moment. Flip to allow_simultaneous: true only alongside adding real
# locking for those sequences, not on its own.

- name: Ensure the odoo-tenant Job Template exists
  awx.awx.job_template:
    name: "{{ awx_job_template_name }}"
    project: "{{ awx_project_name }}"
    playbook: site.yml
    inventory: "{{ awx_inventory_name }}"
    credentials:
      - "{{ awx_machine_credential_name }}"
      - "{{ awx_vault_credential_name }}"
    allow_simultaneous: false
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec: "{{ awx_survey_spec | combine({'name': awx_job_template_name}) }}"
    notification_templates_error:
      - "{{ awx_failure_notification_template_name }}"
    state: present

# odoo_action=check-snapshot-freshness needs no per-tenant looping (see
# roles/deploy-odoo tasks/main.yml header comment) - a plain AWX Schedule
# with fixed extra_vars against the one Job Template covers it, same
# mechanism README "Scheduled operations" already rules out for backup
# specifically because backup needs one call per tenant.
- name: Ensure the nightly snapshot-freshness-check Schedule exists
  awx.awx.schedule:
    name: "{{ awx_snapshot_freshness_schedule_name }}"
    unified_job_template: "{{ awx_job_template_name }}"
    rrule: "{{ awx_snapshot_freshness_rrule }}"
    extra_data:
      odoo_action: check-snapshot-freshness
    enabled: true
    state: present
