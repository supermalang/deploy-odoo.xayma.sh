---
# Router step behind the WFJT `odoo-tenant` (see roles/configure-awx and
# README "AWX"). AWX Workflow Job Templates can only branch on a node's
# success/failure - there is no declarative way to branch a workflow node
# on an extra_var's VALUE. So the "router pattern" is implemented
# imperatively here: this tiny playbook reads `odoo_action`, calls the AWX
# API to launch whichever INTERNAL Job Template owns that action
# (odoo-lifecycle-internal for the fast actions, odoo-provision-internal
# for the slow ones), forwarding every extra_var it received, then waits
# for it and fails if it failed - so the WFJT's own single node still
# surfaces a normal success/failure.
#
# Requires an AWX/Controller API credential attached to the `odoo-router`
# Job Template (injects CONTROLLER_HOST/CONTROLLER_OAUTH_TOKEN - see
# roles/configure-awx/README section in the main README's "AWX" - the
# awx.awx modules below pick these up from the environment automatically,
# no explicit connection params needed here).
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _fast_actions: [start, stop, suspend, restart, edit-domain, change-plan, apply-plan]
    _slow_actions: [deploy, delete, restore, backup, check-snapshot-freshness]
  tasks:
    - name: Assert odoo_action is one this router knows how to dispatch
      ansible.builtin.assert:
        that: odoo_action is defined and odoo_action in (_fast_actions + _slow_actions + ['sync-addons'])
        fail_msg: "odoo_action ({{ odoo_action | default('UNSET') }}) is not a recognized action - see README Actions table."

    - name: Pick the target internal Job Template
      ansible.builtin.set_fact:
        _target_job_template: >-
          {{ 'odoo-lifecycle-internal' if odoo_action in _fast_actions
             else 'odoo-provision-internal' }}

    # Explicit allow-list (not a generic "forward every var" trick, which is
    # fragile against AWX/Ansible internals) - every field the WFJT's own
    # survey exposes (see roles/configure-awx). `default(omit)` is
    # Ansible's standard idiom for "only include this dict key if the var
    # was actually set" - undefined ones simply vanish from extra_vars.
    - name: "Launch {{ _target_job_template }} with this call's extra_vars"
      awx.awx.job_launch:
        job_template: "{{ _target_job_template }}"
        extra_vars:
          odoo_action: "{{ odoo_action }}"
          customer: "{{ customer | default(omit) }}"
          instancename: "{{ instancename | default(omit) }}"
          version: "{{ version | default(omit) }}"
          custom_domain: "{{ custom_domain | default(omit) }}"
          plan: "{{ plan | default(omit) }}"
          plan_spec: "{{ plan_spec | default(omit) }}"
          plan_spec_json: "{{ plan_spec_json | default(omit) }}"
          snapshot_id: "{{ snapshot_id | default(omit) }}"
          snapshot_kind: "{{ snapshot_kind | default(omit) }}"
      register: _router_launch

    - name: Wait for the internal Job Template to finish
      awx.awx.job_wait:
        job_id: "{{ _router_launch.id }}"
      register: _router_result

    - name: Assert the internal Job Template succeeded
      ansible.builtin.assert:
        that: _router_result.status == 'successful'
        fail_msg: >-
          {{ _target_job_template }} (job {{ _router_launch.id }}) finished
          with status={{ _router_result.status }} - see its own job output
          in AWX for details.
